<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  const { DAYS, DAYFULL, START_MIN, END_MIN, TOTAL_MIN, toMin, fmt, dstr, dateKey, detectCourse, stripPart,
    base, noClassDay, weeks, examDates, COURSE_NAMES, COURSE_COLOR, FINAL_WEIGHT,
    WEEKLY_HABITS, DAILY_HABITS, TASKS, DEADLINES, GRADES, STUDY_PLAN,
    buildDeadlines, resolveDeadlineDate, periodStartFor, genericTasks, getTasks,
    leadDays, priorityScore, spliceBlock, buildDayBlocks, resolveWeekForDate,
    resolveGradeItem, gradeItemStatus, computeCourseGrade,
    GRADE_SCALE, letterGrade, neededForTarget } = window.ENGINE;
  const PPM = 1.4;             // pixels per minute
  const HOUR_PX = 60*PPM;

  // ---- auto-scheduler: fills upcoming study blocks with the highest-priority
  // pending tasks that fit, recomputed fresh every render so anything left
  // unchecked when a block ends automatically flows into the next open block.
  function getUpcomingStudyBlocks(horizonDays){
    const now = new Date();
    const blocks = [];
    for(let d=0; d<=horizonDays; d++){
      const date = new Date(now); date.setDate(now.getDate()+d); date.setHours(0,0,0,0);
      const week = resolveWeekForDate(date) || weeks.find(w=>w.id==="std");
      const dayIdx = (date.getDay()+6)%7;
      const dayName = DAYS[dayIdx];
      const dayStudyBlocks = buildDayBlocks(week, dayName).filter(b=>b[3]==="study");
      dayStudyBlocks.forEach((b,bi)=>{
        const [start,end] = b;
        const [sh,sm] = start.split(":").map(Number);
        const [eh,em] = end.split(":").map(Number);
        const blockStart = new Date(date); blockStart.setHours(sh,sm,0,0);
        const blockEnd = new Date(date); blockEnd.setHours(eh,em,0,0);
        if(blockEnd <= now) return;
        const capacityStart = blockStart < now ? now : blockStart;
        const capacityMin = Math.round((blockEnd-capacityStart)/60000);
        if(capacityMin <= 0) return;
        blocks.push({ date, start, end, capacityMin, blockKey: date.toDateString()+"|"+start, isLastOfDay: bi===dayStudyBlocks.length-1 });
      });
    }
    return blocks;
  }
  // Cap how much gets scheduled into any single sitting. Without this, a long block
  // (e.g. a 3+ hour Saturday block) would swallow several deadlines' worth of prep
  // in one sitting, which — combined with there being far more block capacity than
  // task content overall — front-loads the whole term into the first few days.
  // Anything past this cap is left as flexible time, not force-filled.
  const SESSION_CAP_MIN = 90;
  // Habits get their own, smaller pool of leftover capacity per block — kept separate
  // from SESSION_CAP_MIN so a block that's already full of deadline prep doesn't also
  // get buried in habit items, but a block with room still gets a realistic amount.
  const HABIT_CAP_MIN = 45;
  function scheduleTasks(){
    const consumed = new Set(); // taskIds placed already, this computation
    const assignment = {};
    const blocks = getUpcomingStudyBlocks(110);
    const undone = DEADLINES.filter(i=>!isDone(i.id));
    const byPriority = [...undone].sort((a,b)=> priorityScore(b)-priorityScore(a));

    function fillFrom(list, block, remaining, picked, windowOnly){
      for(const item of list){
        if(remaining.v<=0) break;
        if(windowOnly){
          const date = resolveDeadlineDate(item);
          if(date){
            const daysAhead = Math.round((date-block.date)/86400000);
            if(daysAhead > leadDays(item)) continue; // not eligible yet at this block's date
          }
        }
        const tasks = getTasks(item);
        for(let idx=0; idx<tasks.length; idx++){
          if(remaining.v<=0) break;
          const taskId = item.id+"::t"+idx;
          if(isDone(taskId) || consumed.has(taskId)) continue;
          if(tasks[idx].minutes<=remaining.v){
            picked.push({ taskId, text:tasks[idx].text, minutes:tasks[idx].minutes, item });
            consumed.add(taskId);
            remaining.v -= tasks[idx].minutes;
          }
        }
      }
    }

    function fillHabits(block, budget, picked){
      // daily Anki goes first, and only at the end of the day: it's small, resets if
      // missed rather than banking up, so it shouldn't lose out to a bulkier weekly item
      if(block.isLastOfDay){
        for(const h of DAILY_HABITS){
          if(budget.v<=0) break;
          if(h.minutes>budget.v) continue;
          const id = "habit-d-"+h.course+"-"+block.date.toDateString();
          if(isDone(id) || consumed.has(id)) continue;
          picked.push({ taskId:id, text:h.text, minutes:h.minutes, item:{ course:h.course, text:"Daily habit" } });
          consumed.add(id);
          budget.v -= h.minutes;
        }
      }
      // weekly habits take whatever's left; eligible as soon as their course's current
      // period opens, and blocks are visited oldest-first so these naturally land near
      // period start
      for(let hi=0; hi<WEEKLY_HABITS.length; hi++){
        if(budget.v<=0) break;
        const h = WEEKLY_HABITS[hi];
        if(h.minutes>budget.v) continue;
        const periodStart = periodStartFor(block.date, h.weekStart);
        const id = "habit-w-"+hi+"-"+periodStart.toDateString();
        if(isDone(id) || consumed.has(id)) continue;
        picked.push({ taskId:id, text:h.text, minutes:h.minutes, item:{ course:h.course, text:"Weekly habit" } });
        consumed.add(id);
        budget.v -= h.minutes;
      }
    }

    for(const block of blocks){
      const remaining = { v: Math.min(block.capacityMin, SESSION_CAP_MIN) };
      const picked = [];
      fillFrom(byPriority, block, remaining, picked, true);  // only what's actually due-soon-enough to matter here
      const usedByDeadlines = Math.min(block.capacityMin, SESSION_CAP_MIN) - remaining.v;
      const habitBudget = { v: Math.min(block.capacityMin-usedByDeadlines, HABIT_CAP_MIN) };
      fillHabits(block, habitBudget, picked);
      if(picked.length) assignment[block.blockKey] = picked;
    }
    return assignment;
  }
  function toggleTask(item, idx){
    const taskId = item.id+"::t"+idx;
    setDone(taskId, !isDone(taskId));
    refreshAll();
    renderBlockModal();
  }

  // ---- done-state store (localStorage) ----
  const DONE_KEY = "semcal-done-v1";
  function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY)||"{}"); }catch(e){ return {}; } }
  let doneState = loadDone();
  function isDone(id){ return !!doneState[id]; }
  function setDone(id,val){
    if(val) doneState[id]=true; else delete doneState[id];
    try{ localStorage.setItem(DONE_KEY, JSON.stringify(doneState)); }catch(e){}
  }
  function toggleDone(id){ setDone(id, !isDone(id)); refreshAll(); }

  // ---- started/in-progress state store (Due tab only, localStorage) ----
  const STARTED_KEY = "semcal-started-v1";
  function loadStarted(){ try{ return JSON.parse(localStorage.getItem(STARTED_KEY)||"{}"); }catch(e){ return {}; } }
  let startedState = loadStarted();
  function isStarted(id){ return !!startedState[id]; }
  function setStarted(id,val){
    if(val) startedState[id]=true; else delete startedState[id];
    try{ localStorage.setItem(STARTED_KEY, JSON.stringify(startedState)); }catch(e){}
  }
  function toggleStarted(id){ setStarted(id, !isStarted(id)); refreshAll(); }

  // ---- grades store (localStorage) — keyed by "<course>::<catIdx>::<itemIdx>" ----
  const GRADES_KEY = "semcal-grades-v1";
  function loadGrades(){ try{ return JSON.parse(localStorage.getItem(GRADES_KEY)||"{}"); }catch(e){ return {}; } }
  let gradesState = loadGrades();
  function getGrade(id){ return gradesState[id]!=null ? gradesState[id] : null; }
  function setGrade(id, val){
    if(val==null || val==="") delete gradesState[id]; else gradesState[id]=val;
    try{ localStorage.setItem(GRADES_KEY, JSON.stringify(gradesState)); }catch(e){}
  }

  // ---- predicted-grade store (localStorage) — same id scheme as the real
  // grades store, but for the student's own guess at an item that isn't
  // marked yet (ported from queens-semester-calendar's "predicted grades").
  // Never overrides a real grade; computeCourseGrade() only ever consults
  // this for an item that has no real grade of its own.
  const PREDICTED_KEY = "semcal-predicted-v1";
  function loadPredicted(){ try{ return JSON.parse(localStorage.getItem(PREDICTED_KEY)||"{}"); }catch(e){ return {}; } }
  let predictedState = loadPredicted();
  function getPredicted(id){ return predictedState[id]!=null ? predictedState[id] : null; }
  function setPredicted(id, val){
    if(val==null || val==="") delete predictedState[id]; else predictedState[id]=val;
    try{ localStorage.setItem(PREDICTED_KEY, JSON.stringify(predictedState)); }catch(e){}
  }

  // ---- grade target store (localStorage) — keyed by course, the letter
  // grade (its minimum %) each course is aiming for, same style as
  // queens-semester-calendar's Grades tab ----
  const TARGET_KEY = "semcal-grade-target-v1";
  function loadTargets(){ try{ return JSON.parse(localStorage.getItem(TARGET_KEY)||"{}"); }catch(e){ return {}; } }
  let targetState = loadTargets();
  function getTarget(course){ return targetState[course]!=null ? targetState[course] : 80; }
  function setTarget(course, min){
    targetState[course] = min;
    try{ localStorage.setItem(TARGET_KEY, JSON.stringify(targetState)); }catch(e){}
  }

  // Calendar blocks: past ones are checked by default (the time already happened),
  // but that's just a default — an explicit check or uncheck always wins over it.
  function isBlockDone(blockId, autoByTime){
    if(doneState[blockId]) return true;
    if(doneState[blockId+":off"]) return false;
    return autoByTime;
  }
  function toggleBlockDone(blockId, autoByTime){
    if(isBlockDone(blockId, autoByTime)){
      setDone(blockId, false);
      setDone(blockId+":off", autoByTime);
    } else {
      setDone(blockId, true);
      setDone(blockId+":off", false);
    }
    refreshAll();
  }

  const legendItems = [
    ["class","Class / lecture / lab"],
    ["study","Study block"],
    ["commute","Walk to/from campus"],
    ["break","Break"],
    ["sport","Volleyball / Ultimate"],
    ["sleep","Sleep &amp; wind-down"],
    ["meal","Meals"],
    ["therapy","Therapy"],
    ["downtime","Protected downtime"],
  ];
  const legendEl = document.getElementById("legend");
  legendItems.forEach(([cat,label])=>{
    const d=document.createElement("div"); d.className="item";
    d.innerHTML = `<span class="swatch" style="background:var(--${cat})"></span>${label}`;
    legendEl.appendChild(d);
  });
  const flagLegend = document.createElement("div"); flagLegend.className="item";
  flagLegend.innerHTML = `<span class="swatch flagged"></span>Quiz / exam flagged on that block`;
  legendEl.appendChild(flagLegend);

  const weekbarEl = document.getElementById("weekbar");
  weeks.filter(w=>w.id!=="std").forEach(w=>{
    const b=document.createElement("button");
    b.textContent=w.label; b.dataset.id=w.id;
    b.addEventListener("click",()=>render(w.id));
    weekbarEl.appendChild(b);
  });
  function setActive(id){ [...weekbarEl.children].forEach(b=> b.classList.toggle("active", b.dataset.id===id)); }

  let currentWeekId = "std";

  function render(id){
    currentWeekId = id;
    const week = weeks.find(w=>w.id===id);
    setActive(id);
    document.getElementById("weeknote").innerHTML = (week.range==="Typical week" ? "" : `<b>${week.range}.</b> `) + week.note;

    const calwrap = document.getElementById("calwrap");
    calwrap.innerHTML = "";
    calwrap.style.setProperty("--hr", HOUR_PX+"px");

    // time column
    const timecol = document.createElement("div");
    timecol.className = "timecol timeline-bg";
    timecol.style.height = (TOTAL_MIN*PPM)+"px";
    for(let m=START_MIN; m<=END_MIN; m+=60){
      const h = Math.floor(m/60)%24; const ap = h>=12?"pm":"am"; let h12=h%12; if(h12===0)h12=12;
      const lbl = document.createElement("div");
      lbl.className = "hourlabel";
      lbl.style.top = ((m-START_MIN)*PPM)+"px";
      lbl.textContent = h12+ap;
      timecol.appendChild(lbl);
    }

    const headTimeCell = document.createElement("div");
    headTimeCell.className = "headcell timehead";

    const headrow = document.createElement("div");
    headrow.className = "headrow";
    headrow.appendChild(headTimeCell);

    const bodyrow = document.createElement("div");
    bodyrow.className = "bodyrow";
    bodyrow.appendChild(timecol);

    DAYS.forEach((day,i)=>{
      const head = document.createElement("div");
      head.className = "headcell";
      const dateLabel = week.dates ? dstr(week.dates[i]) : "";
      const dueList = (week.due && week.due[day]) || [];
      head.innerHTML = `<div class="dayname">${DAYFULL[i]}</div><div class="daydate mono">${dateLabel}</div>
        <div class="duewrap">${dueList.map((entry,idx)=>{
          const did = "due-"+week.id+"-"+day+"-"+idx;
          const done = isDone(did);
          return `<label class="duetag${done?" done":""}"><input type="checkbox" data-id="${did}" ${done?"checked":""}><span>${entry.text}</span></label>`;
        }).join("")}</div>`;
      headrow.appendChild(head);
      head.querySelectorAll(".duetag input[type=checkbox]").forEach(cb=>{
        cb.addEventListener("change", ()=> toggleDone(cb.dataset.id));
      });

      const col = document.createElement("div");
      col.className = "daycol timeline-bg";
      col.style.height = (TOTAL_MIN*PPM)+"px";

      const now = new Date();
      buildDayBlocks(week, day).forEach(b=>{
        const [start,end,label,cat,location,flagMark,courseColorKey,planMeta] = b;
        const top = (toMin(start)-START_MIN)*PPM;
        const height = (toMin(end)-toMin(start))*PPM;
        const div = document.createElement("div");
        const blockId = "blk-"+week.id+"-"+day+"-"+start;
        let autoByTime = false;
        const blockDate = week.dates ? week.dates[i] : null;
        if(week.dates){
          const [eh,em] = end.split(":").map(Number);
          const blockEnd = new Date(week.dates[i]); blockEnd.setHours(eh,em,0,0);
          autoByTime = blockEnd <= now;
        }
        const done = isBlockDone(blockId, autoByTime);
        const compact = height < 40; // too short to stack a time line + label legibly
        div.className = "block " + cat + (flagMark ? " flagged" : "") + (done ? " done" : "") + (compact ? " compact" : "");
        div.style.top = top+"px";
        div.style.height = Math.max(height,16)+"px";
        if(courseColorKey){
          // Catch-up study plan: this block is doing double duty as a specific
          // course's prep, not generic study time — recolor to that course
          // instead of the generic study amber.
          div.style.background = "var(--"+courseColorKey+"-tint)";
          div.style.color = "var(--"+courseColorKey+")";
          div.style.borderColor = "var(--"+courseColorKey+")";
        }
        div.title = fmt(start)+"–"+fmt(end)+" "+label;
        div.innerHTML = compact
          ? `<input type="checkbox" class="block-check" ${done?"checked":""} aria-label="Mark done"><span class="l">${label}${location?' <span class="loc-pin">📍</span>':""}</span>`
          : `<span class="t"><input type="checkbox" class="block-check" ${done?"checked":""} aria-label="Mark done">${fmt(start)}–${fmt(end)}</span><span class="l">${label}${location?' <span class="loc-pin">📍</span>':""}</span>`;
        div.querySelector(".block-check").addEventListener("click", e=>{
          e.stopPropagation();
          toggleBlockDone(blockId, autoByTime);
        });
        if(cat==="study"){
          div.style.cursor = "pointer";
          div.addEventListener("click", ()=> openBlockModal(blockDate, start, end, label, planMeta));
        } else if(location){
          div.style.cursor = "pointer";
          div.addEventListener("click", ()=> openLocationModal(label, location, blockDate, start, end));
        }
        col.appendChild(div);
      });

      bodyrow.appendChild(col);
    });

    calwrap.style.flexDirection = "column";
    calwrap.appendChild(headrow);
    calwrap.appendChild(bodyrow);

    renderAgenda(week);
  }

  // ---- calendar: phone agenda view (a day list instead of the grid,
  // ported from queens-semester-calendar) — same buildDayBlocks() data as
  // the grid, same block/due ids, so done-state and the block-detail modal
  // stay identical between the two views.
  function agItemHtml(b, blockId, done){
    const [start,end,label,cat,location,flagMark,courseColorKey] = b;
    const colorKey = courseColorKey || cat;
    return `<div class="ag-item ${cat}${flagMark?" flagged":""}${done?" done":""}" data-blockid="${blockId}" style="--c:var(--${colorKey}); --ct:var(--${colorKey}-tint);">
      <input type="checkbox" class="ag-check" ${done?"checked":""} aria-label="Mark done">
      <span class="ag-time">${fmt(start)}<br>${fmt(end)}</span>
      <span class="ag-body">
        <b>${label}</b>${location?` <span class="ag-loc">📍</span>`:""}
      </span>
    </div>`;
  }
  // Built alongside the HTML string (same loop, same order) so the click
  // handlers below can close over the real block objects instead of
  // re-parsing them back out of the DOM.
  function renderAgenda(week){
    const el = document.getElementById("agenda");
    const now = new Date();
    const today = new Date(); today.setHours(0,0,0,0);
    const clicks = []; // { blockId, autoByTime, cat, location, blockDate, start, end, label, planMeta }

    el.innerHTML = DAYS.map((day,i)=>{
      const blockDate = week.dates ? week.dates[i] : null;
      const isToday = blockDate && blockDate.getTime()===today.getTime();
      const dateLabel = week.dates ? dstr(week.dates[i]) : "";
      const dueList = (week.due && week.due[day]) || [];
      const dueHtml = dueList.map((entry,idx)=>{
        const did = "due-"+week.id+"-"+day+"-"+idx;
        const done = isDone(did);
        return `<label class="duetag${done?" done":""}"><input type="checkbox" data-id="${did}" ${done?"checked":""}><span>${entry.text}</span></label>`;
      }).join("");
      const blocks = buildDayBlocks(week, day);
      const itemsHtml = blocks.length
        ? blocks.map(b=>{
            const [start,end,label,cat,location,,,planMeta] = b;
            const blockId = "blk-"+week.id+"-"+day+"-"+start;
            let autoByTime = false;
            if(week.dates){
              const [eh,em] = end.split(":").map(Number);
              const blockEnd = new Date(week.dates[i]); blockEnd.setHours(eh,em,0,0);
              autoByTime = blockEnd <= now;
            }
            const done = isBlockDone(blockId, autoByTime);
            clicks.push({ blockId, autoByTime, cat, location, blockDate, start, end, label, planMeta });
            return agItemHtml(b, blockId, done);
          }).join("")
        : (dueList.length ? "" : `<p class="ag-empty">Nothing scheduled</p>`);
      return `<section class="ag-day${isToday?" today":""}">
        <h4>${DAYFULL[i]}, ${dateLabel}${isToday?` <span class="ag-today-tag">Today</span>`:""}</h4>
        ${dueHtml ? `<div class="ag-duewrap">${dueHtml}</div>` : ""}
        ${itemsHtml}
      </section>`;
    }).join("");

    el.querySelectorAll(".duetag input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=> toggleDone(cb.dataset.id));
    });
    el.querySelectorAll(".ag-item").forEach((row,idx)=>{
      const c = clicks[idx];
      row.querySelector(".ag-check").addEventListener("click", e=>{
        e.stopPropagation();
        toggleBlockDone(c.blockId, c.autoByTime);
      });
      if(c.cat==="study"){
        row.style.cursor = "pointer";
        row.addEventListener("click", ()=> openBlockModal(c.blockDate, c.start, c.end, c.label, c.planMeta));
      } else if(c.location){
        row.style.cursor = "pointer";
        row.addEventListener("click", ()=> openLocationModal(c.label, c.location, c.blockDate, c.start, c.end));
      }
    });
  }

  // ---- Due tab: show/hide ungraded work, course filter, show/hide done —
  // all localStorage, style ported from queens-semester-calendar's Due tab ----
  const SHOW_UNGRADED_KEY = "semcal-show-ungraded-v1";
  function loadShowUngraded(){
    const raw = localStorage.getItem(SHOW_UNGRADED_KEY);
    return raw===null ? true : raw==="1"; // default: show everything, matching prior behavior
  }
  let showUngraded = loadShowUngraded();

  const DUE_COURSE_KEY = "semcal-due-course-v1";
  function loadDueCourse(){ try{ return localStorage.getItem(DUE_COURSE_KEY) || "all"; }catch(e){ return "all"; } }
  let dueCourseFilter = loadDueCourse();
  function setDueCourseFilter(c){ dueCourseFilter = c; try{ localStorage.setItem(DUE_COURSE_KEY, c); }catch(e){} }

  const DUE_SHOWDONE_KEY = "semcal-due-showdone-v1";
  function loadDueShowDone(){ try{ return localStorage.getItem(DUE_SHOWDONE_KEY)==="1"; }catch(e){ return false; } }
  let dueShowDone = loadDueShowDone();
  function setDueShowDone(v){ dueShowDone = v; try{ localStorage.setItem(DUE_SHOWDONE_KEY, v?"1":"0"); }catch(e){} }

  // Not started / Started / Done, reusing the existing done+started stores
  // as a single three-state cycle (one tap moves to the next state) instead
  // of a separate checkbox and text-tap.
  function dueStatus(id){ return isDone(id) ? "done" : isStarted(id) ? "started" : "todo"; }
  function cycleDueStatus(id){
    const st = dueStatus(id);
    if(st==="done"){ setDone(id,false); setStarted(id,false); }
    else if(st==="started"){ setDone(id,true); }
    else { setStarted(id,true); }
    refreshAll();
  }
  const DUE_STATUS_LABEL = { todo:"Not started", started:"Started", done:"Done" };
  function dueRowHtml(item, today){
    const date = resolveDeadlineDate(item);
    const st = dueStatus(item.id);
    const daysUntil = date ? Math.round((date-today)/86400000) : null;
    const dateStr = date ? date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : null;
    const rel = daysUntil==null ? (item.text && item.text.length ? "Date not set yet" : "")
      : daysUntil===0 ? "today" : daysUntil===1 ? "tomorrow" : daysUntil===-1 ? "1 day late"
      : daysUntil<0 ? `${-daysUntil} days late` : `in ${daysUntil} days`;
    const color = "var(--"+(COURSE_COLOR[item.course]||"class")+")";
    const ungraded = item.graded===false;
    const weightStr = ungraded ? "Ungraded" : (item.weight ? (Math.round(item.weight*10)/10)+"%" : "");
    return `<li class="due-row st-${st}">
      <span class="dot" style="background:${color}"></span>
      <span class="due-main" style="color:${st==='done'?'':'var(--ink)'}">
        <span><b style="color:${color}">${COURSE_NAMES[item.course]||item.course}</b> ${item.text}</span>
        <span class="due-meta">${dateStr?dateStr+" · "+rel:rel}</span>
      </span>
      <span class="due-weight mono">${weightStr}</span>
      <button type="button" class="status-btn st-${st}" data-cycle-id="${item.id}">${DUE_STATUS_LABEL[st]}</button>
    </li>`;
  }
  function renderDue(){
    const el = document.getElementById("duelist");
    const toggle = document.getElementById("showUngraded");
    if(toggle) toggle.checked = showUngraded;

    // Fixed study-plan items never carry forward on the To-Do tab — instead,
    // once one slips past its own date and is still undone, it surfaces
    // here as a catch-up flag (the real graded deadline it references, if
    // any, is already tracked on this tab in its own right).
    const today = new Date(); today.setHours(0,0,0,0);
    const overdueFixed = allFixedItems().filter(i=> i.date<today && !isDone(i.id));
    let list = (showUngraded ? DEADLINES : DEADLINES.filter(i=> i.graded!==false)).concat(overdueFixed);
    if(dueCourseFilter!=="all") list = list.filter(i=> i.course===dueCourseFilter);

    const courseChips = `<div class="due-filters">
      <button type="button" class="due-chip${dueCourseFilter==="all"?" on":""}" data-course-chip="all">All</button>
      ${Object.keys(COURSE_NAMES).map(c=>
        `<button type="button" class="due-chip${dueCourseFilter===c?" on":""}" data-course-chip="${c}" style="${dueCourseFilter===c?`background:var(--${COURSE_COLOR[c]});border-color:var(--${COURSE_COLOR[c]});color:var(--surface);`:""}">
          <span class="dot" style="background:${dueCourseFilter===c?"currentColor":"var(--"+COURSE_COLOR[c]+")"}"></span>${COURSE_NAMES[c]}
        </button>`).join("")}
    </div>`;

    const hiddenDone = list.filter(i=> isDone(i.id)).length;
    if(!dueShowDone) list = list.filter(i=> !isDone(i.id));

    if(!list.length){
      el.innerHTML = courseChips + `<div class="todo-empty">${hiddenDone?"Everything here is done.":"Nothing on the list."}</div>`
        + (hiddenDone ? `<button type="button" class="due-show-done" data-toggle-done="1">Show ${hiddenDone} finished</button>` : "");
    } else {
      const groups = [
        { name:"Overdue", test:(i,d)=> d && d<today },
        { name:"This week", test:(i,d)=> d && d>=today && Math.round((d-today)/86400000)<=6 },
        { name:"Next week", test:(i,d)=> d && Math.round((d-today)/86400000)>=7 && Math.round((d-today)/86400000)<=13 },
        { name:"Later", test:(i,d)=> d && Math.round((d-today)/86400000)>=14 },
        { name:"Date not set", test:(i,d)=> !d },
      ];
      const dated = list.map(i=> ({ i, d: resolveDeadlineDate(i) }));
      const body = groups.map(g=>{
        const items = dated.filter(({i,d})=> g.test(i,d));
        if(!items.length) return "";
        return `<div class="due-group${g.name==="Overdue"?" overdue":""}">
          <div class="due-group-head">${g.name} <span class="count">${items.length}</span></div>
          <ul class="due-rows">${items.map(({i})=> dueRowHtml(i,today)).join("")}</ul>
        </div>`;
      }).join("");
      el.innerHTML = courseChips + body
        + (hiddenDone || dueShowDone ? `<button type="button" class="due-show-done" data-toggle-done="${dueShowDone?"0":"1"}">${dueShowDone?"Hide finished work":`Show ${hiddenDone} finished`}</button>` : "");
    }

    el.querySelectorAll(".due-chip").forEach(btn=>{
      btn.addEventListener("click", ()=>{ setDueCourseFilter(btn.dataset.courseChip); renderDue(); });
    });
    el.querySelectorAll("[data-toggle-done]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ setDueShowDone(btn.dataset.toggleDone==="1"); renderDue(); });
    });
    el.querySelectorAll(".status-btn[data-cycle-id]").forEach(btn=>{
      btn.addEventListener("click", ()=> cycleDueStatus(btn.dataset.cycleId));
    });
  }

  // ---- to-do tab (study/prep tasks, as opposed to the Due tab's actual
  // graded quizzes/assignments/exams) ----
  // Grouped by what the work is FOR: one group per upcoming due item (its
  // sub-tasks nested under it), then a "Recurring" section for habits that
  // aren't tied to a specific due date, grouped by course instead.
  function buildTaskGroups(){
    // Includes completed tasks (shown checked/struck-through, not removed) so
    // checking one off doesn't make it vanish out from under you — same fix
    // as the block modal, same reason.
    const today = new Date(); today.setHours(0,0,0,0);
    const dueGroups = [];
    DEADLINES.forEach(item=>{
      if(isDone(item.id)) return;
      const date = resolveDeadlineDate(item);
      if(!date) return; // TBA items (unpublished finals) have no useful urgency yet
      const daysAhead = Math.round((date-today)/86400000);
      if(daysAhead > leadDays(item)) return; // not worth surfacing yet
      const tasks = getTasks(item).map((t,idx)=> ({ taskId:item.id+"::t"+idx, text:t.text, minutes:t.minutes }));
      dueGroups.push({ item, tasks, date, score:priorityScore(item) });
    });
    dueGroups.sort((a,b)=> b.score-a.score);

    const habitsByCourse = {};
    WEEKLY_HABITS.forEach((h,hi)=>{
      const periodStart = periodStartFor(today, h.weekStart);
      const id = "habit-w-"+hi+"-"+periodStart.toDateString();
      if(!habitsByCourse[h.course]) habitsByCourse[h.course] = [];
      habitsByCourse[h.course].push({ taskId:id, text:h.text, minutes:h.minutes });
    });
    DAILY_HABITS.forEach(h=>{
      const id = "habit-d-"+h.course+"-"+today.toDateString();
      if(!habitsByCourse[h.course]) habitsByCourse[h.course] = [];
      habitsByCourse[h.course].push({ taskId:id, text:h.text, minutes:h.minutes });
    });

    return { dueGroups, habitsByCourse };
  }
  function taskRowHtml(t, color){
    const done = isDone(t.taskId);
    return `<label class="todo-row${done?" done":""}">
      <input type="checkbox" data-taskid="${t.taskId}" ${done?"checked":""} style="accent-color:${color}">
      <span class="todo-text">${t.text}</span>
    </label>`;
  }
  function taskGroupHtml(headLabel, color, dateStr, tasks){
    return `<div class="task-group">
      <div class="task-group-head" style="color:${color}">
        <span>${headLabel}</span>
        ${dateStr?`<span class="todo-date mono">${dateStr}</span>`:""}
      </div>
      ${tasks.map(t=> taskRowHtml(t,color)).join("")}
    </div>`;
  }
  // ---- catch-up study plan (Update 2, Nov 14 afternoon): focus-day ids,
  // the "fixed" hard-deadline items it carries, and the carry-forward rule
  // for undone tasks ----
  function fixedItemId(key,idx){ return "studyplan-fixed-"+key+"-"+idx; }
  function taskItemId(key,idx){ return "studyplan-task-"+key+"-"+idx; }
  // Nov 14-19 was retired on Update 3 (Nov 20) rather than carried forward —
  // carry-forward never reaches back before this date, even if an earlier
  // entry were ever re-added to STUDY_PLAN.
  const STUDY_PLAN_START_KEY = "2026-11-20";
  function focusPlanEntries(){
    return Object.keys(STUDY_PLAN)
      .filter(k=> Array.isArray(STUDY_PLAN[k].tasks))
      .sort()
      .map(k=> ({ key:k, plan:STUDY_PLAN[k] }));
  }
  // Every `fixed` item across the whole plan, as a synthetic deadline-like
  // object todoRowHtml()/resolveDeadlineDate() already know how to render —
  // only pulled onto the Due tab once it's actually overdue (see renderDue).
  function allFixedItems(){
    const out = [];
    focusPlanEntries().forEach(({key,plan})=>{
      (plan.fixed||[]).forEach((f,idx)=>{
        const [y,m,d] = f.date.split("-").map(Number);
        out.push({ id:fixedItemId(key,idx), text:f.text, course:detectCourse(f.text),
          weight:0, graded:false, kind:"task", date:new Date(y,m-1,d) });
      });
    });
    return out;
  }
  // Undone tasks from earlier same-focus days, surfaced on the next
  // same-focus day at or after today (today's own rendering only — this
  // doesn't rewrite STUDY_PLAN or touch any other date's calendar blocks).
  function getCarriedTasks(todayKey){
    const entries = focusPlanEntries();
    const todayEntry = entries.find(e=>e.key===todayKey);
    if(!todayEntry || !todayEntry.plan.focus) return [];
    const focus = todayEntry.plan.focus;
    const sameFocus = entries.filter(e=> e.plan.focus===focus);
    const currentOcc = sameFocus.find(e=> e.key>=todayKey) || sameFocus[sameFocus.length-1];
    if(!currentOcc || currentOcc.key!==todayKey) return [];
    const carried = [];
    sameFocus.forEach(e=>{
      if(e.key>=todayKey || e.key<STUDY_PLAN_START_KEY) return;
      (e.plan.tasks||[]).forEach((t,i)=>{
        const taskId = taskItemId(e.key,i);
        if(!isDone(taskId)) carried.push({ taskId, text:t, fromKey:e.key });
      });
    });
    return carried;
  }
  // This week's (Mon-Sun) planned study minutes across all courses vs. done
  // so far — the To-Do tab's "This week" bar, ported from
  // queens-semester-calendar's weekly summary.
  function computeWeekStudyProgress(){
    const today = new Date(); today.setHours(0,0,0,0);
    const monday = new Date(today); monday.setDate(today.getDate()-((today.getDay()+6)%7));
    let plannedMin=0, doneMin=0;
    for(let k=0;k<7;k++){
      const d = new Date(monday); d.setDate(monday.getDate()+k);
      const week = resolveWeekForDate(d);
      if(!week) continue;
      const dayName = DAYS[(d.getDay()+6)%7];
      const dayMin = buildDayBlocks(week, dayName).filter(b=>b[3]==="study")
        .reduce((s,b)=> s+(toMin(b[1])-toMin(b[0])), 0);
      plannedMin += dayMin;
      if(d>today) continue;
      const key = dateKey(d);
      const plan = STUDY_PLAN[key];
      if(plan && Array.isArray(plan.tasks) && plan.focus){
        const tasks = plan.tasks||[];
        let doneCount=0; tasks.forEach((t,i)=>{ if(isDone(taskItemId(key,i))) doneCount++; });
        doneMin += dayMin * (tasks.length ? doneCount/tasks.length : 0);
      }
    }
    return { plannedMin, doneMin };
  }
  function nextWeekendDate(fromDate){
    const d = new Date(fromDate);
    do{ d.setDate(d.getDate()+1); } while(d.getDay()!==0 && d.getDay()!==6);
    return d;
  }
  function studyTaskRowHtml(taskId, text, color, mustDo){
    const done = isDone(taskId);
    const started = !done && isStarted(taskId);
    return `<label class="todo-row${done?" done":""}${started?" started":""}">
      <input type="checkbox" data-taskid="${taskId}" ${done?"checked":""} style="accent-color:${color}">
      <span class="todo-text" data-id="${taskId}">${text}${mustDo?'<span class="task-urgent">must-do</span>':""}</span>
    </label>`;
  }
  // Today's slice of the catch-up study plan (data.js STUDY_PLAN), as its
  // own checkable group at the top of the To-Do tab. Handles both plan
  // shapes: the current one-focus-course-per-day format (with carry-forward
  // + fixed items) and the original am/pm/eve slot format still in use for
  // Dec 7 onward.
  function studyPlanTodayHtml(){
    const today = new Date(); today.setHours(0,0,0,0);
    const key = dateKey(today);
    const plan = STUDY_PLAN[key];
    if(!plan) return "";

    if(Array.isArray(plan.tasks)){
      const color = plan.focus ? "var(--"+(COURSE_COLOR[plan.focus]||"study")+")" : "var(--study)";
      const carried = getCarriedTasks(key);
      let rows = carried.map(c=>
        studyTaskRowHtml(c.taskId, `Carried over from ${new Date(c.fromKey+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})} — ${c.text}`, color)
      ).join("");
      // The first task of the day is the must-do: tagged, and once it's
      // done the day counts "on track" regardless of what else carries
      // forward.
      rows += plan.tasks.map((t,i)=> studyTaskRowHtml(taskItemId(key,i), t, color, i===0)).join("");
      const onTrack = plan.tasks.length>0 && isDone(taskItemId(key,0));
      const fixedRows = (plan.fixed||[]).map((f,idx)=>
        studyTaskRowHtml(fixedItemId(key,idx), f.text, "var(--muted)")
      ).join("");
      let suggestion = "";
      if(carried.length>=2 && plan.focus){
        const wd = nextWeekendDate(today);
        const wdStr = wd.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
        suggestion = `<div class="todo-empty" style="padding:4px 4px 10px;">${carried.length} ${COURSE_NAMES[plan.focus]||plan.focus} tasks have piled up — consider using ${wdStr}'s open block to catch up.</div>`;
      }
      if(!rows && !fixedRows) return "";
      const headLabel = plan.focus ? `${COURSE_NAMES[plan.focus]||plan.focus} — today's focus` : "Today";
      const onTrackBadge = onTrack ? ` <span style="color:var(--meal); font-weight:700; font-size:11px;">✓ On track</span>` : "";
      return `<div class="task-group">
        <div class="task-group-head" style="color:${color}"><span>${headLabel}</span>${onTrackBadge}</div>
        ${rows}
        ${suggestion}
        ${fixedRows ? `<div class="task-group-head" style="color:var(--muted); font-size:11px; margin-top:8px;"><span>Also on your radar today</span></div>${fixedRows}` : ""}
      </div>`;
    }

    const rows = ["am","pm","eve"].filter(slot=> plan[slot]).map(slot=>{
      const entry = plan[slot];
      const taskId = "studyplan-"+key+"-"+slot;
      const done = isDone(taskId);
      const color = entry.course ? "var(--"+(COURSE_COLOR[entry.course]||"study")+")" : "var(--study)";
      const label = (entry.course ? (COURSE_NAMES[entry.course]||entry.course)+" — " : "") + entry.task;
      return `<label class="todo-row${done?" done":""}">
        <input type="checkbox" data-taskid="${taskId}" ${done?"checked":""} style="accent-color:${color}">
        <span class="todo-text">${label}</span>
      </label>`;
    }).join("");
    if(!rows) return "";
    return `<div class="task-group">
      <div class="task-group-head" style="color:var(--study)"><span>Today's catch-up plan</span></div>
      ${rows}
    </div>`;
  }
  function renderTaskTodo(){
    const el = document.getElementById("tasklist");
    const { dueGroups, habitsByCourse } = buildTaskGroups();
    const courseKeys = Object.keys(COURSE_NAMES).filter(c=> habitsByCourse[c] && habitsByCourse[c].length);
    const studyPlanHtml = studyPlanTodayHtml();
    const week = computeWeekStudyProgress();
    const weekPct = week.plannedMin ? Math.min(100, Math.round(week.doneMin/week.plannedMin*100)) : 0;

    let html = "";
    if(studyPlanHtml) html += `<div class="section-card">${studyPlanHtml}</div>`;
    if(week.plannedMin){
      html += `<div class="section-card">
        <div class="section-sum-head"><h3>This week</h3><span class="mono small">${(week.doneMin/60).toFixed(1)} of ${(week.plannedMin/60).toFixed(1)} h</span></div>
        <div class="bar"><div class="bar-fill" style="width:${weekPct}%"></div></div>
      </div>`;
    }
    if(dueGroups.length){
      html += `<div class="section-card"><h3>Prep for upcoming work</h3>` + dueGroups.map(g=>{
        const color = "var(--"+(COURSE_COLOR[g.item.course]||"class")+")";
        const dateStr = g.date ? g.date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : "";
        return taskGroupHtml(`${COURSE_NAMES[g.item.course]||g.item.course} · ${g.item.text}`, color, dateStr, g.tasks);
      }).join("") + `</div>`;
    }
    if(courseKeys.length){
      html += `<div class="section-card"><h3>Recurring</h3>` + courseKeys.map(c=>{
        const color = "var(--"+(COURSE_COLOR[c]||"class")+")";
        return taskGroupHtml(COURSE_NAMES[c], color, "", habitsByCourse[c]);
      }).join("") + `</div>`;
    }
    if(!html) html = `<div class="todo-empty">Nothing due soon enough to need study time yet — check back closer to your next deadline.</div>`;
    el.innerHTML = html;
    el.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const taskId = cb.dataset.taskid;
        if(taskId.indexOf("habit-")===0 || taskId.indexOf("studyplan-")===0){
          setDone(taskId, !isDone(taskId));
          refreshAll();
          return;
        }
        const [itemId, tIdx] = taskId.split("::t");
        const item = DEADLINES.find(d=>d.id===itemId);
        if(item) toggleTask(item, Number(tIdx));
      });
    });
    // Study-plan task rows: tapping the text (not the checkbox) marks it
    // "partly done" (started) rather than done — same started/done split as
    // the Due tab, same reason (so "I'm working on this" is distinct from
    // "I finished this").
    el.querySelectorAll(".todo-text[data-id]").forEach(span=>{
      span.addEventListener("click", e=>{
        e.preventDefault();
        e.stopPropagation();
        toggleStarted(span.dataset.id);
      });
    });
  }

  // ---- grades tab ----
  // Two input columns — Predicted and Actual — ported from
  // queens-semester-calendar's "predicted grades". Once an item is
  // actually marked, its predicted value (if any) just freezes as plain
  // text instead of staying editable, since it's no longer relevant.
  function gradeItemRowHtml(item, needHint){
    const disabled = item.status==="upcoming";
    const entered = item.status==="entered";
    const actualVal = item.grade!=null ? item.grade : "";
    const predictedVal = item.predicted!=null ? item.predicted : "";
    return `<div class="grade-item">
      <div class="grade-item-top">
        <span class="grade-badge ${item.status}">${item.status}</span>
        <span class="grade-item-label">${item.label}</span>
        <span class="grade-item-weight mono">${item.weight}%</span>
      </div>
      <div class="grade-item-inputs">
        <label class="grade-in-field pred">
          <span class="grade-in-tag">Predicted</span>
          ${entered
            ? `<span class="grade-in-frozen mono">${predictedVal!==""?predictedVal+"%":"—"}</span>`
            : `<input type="number" class="grade-input pred" inputmode="decimal" min="0" max="100" step="1"
                data-predictid="${item.id}" value="${predictedVal}" placeholder="${needHint||"—"}"><span class="grade-pct-sign">%</span>`}
        </label>
        <label class="grade-in-field actual">
          <span class="grade-in-tag">Actual</span>
          <input type="number" class="grade-input" inputmode="decimal" min="0" max="100" step="0.01"
            data-gradeid="${item.id}" value="${actualVal}" placeholder="—" ${disabled?"disabled":""}>
          <span class="grade-pct-sign">%</span>
        </label>
      </div>
    </div>`;
  }
  // Target-grade selector options: Queen's letter grades 50%+, matching
  // queens-semester-calendar's Grades tab exactly.
  const GRADE_TARGETS = GRADE_SCALE.filter(([min])=>min>=50);
  function renderGrades(){
    const el = document.getElementById("gradeslist");
    const courses = Object.keys(COURSE_NAMES);
    const intro = `<p style="color:var(--muted); font-size:12.5px; margin:0 0 4px;">Enter marks as they come back. For work that isn't marked yet, type the mark you think you'll realistically get — the blank boxes show what you'd need on the rest to hit your goal.</p>`;
    el.innerHTML = intro + courses.map(c=>{
      const result = computeCourseGrade(c, getGrade, getPredicted);
      const colorVar = COURSE_COLOR[c];
      const target = getTarget(c);
      const targetLetter = letterGrade(target);
      const goalPts = target/100*result.totalWeight;
      const lost = result.gradedWeight - result.earned;
      const pct = x => result.totalWeight ? (x/result.totalWeight*100) : 0;

      let need, needHint = "";
      if(!result.totalWeight) need = "No weights yet.";
      else if(!result.predictedWeight && result.openWeight<=0){
        need = result.currentGrade!=null
          ? `All marked. Final mark: <b>${result.projectedGrade.toFixed(1)}%</b> (${letterGrade(result.projectedGrade)}).`
          : "No weights yet.";
      } else if(result.openWeight>0){
        const req = neededForTarget(result, target);
        const base = result.predictedWeight ? "With your predictions, you need" : "You need";
        need = req<=0 ? `${result.predictedWeight?"With your predictions, you've":"You've"} already locked in ${targetLetter} or better.`
          : req>100 ? `${targetLetter} isn't reachable with the work left${result.predictedWeight?" with these predictions":""} — you'd need ${req.toFixed(1)}% on the remaining ${result.openWeight.toFixed(1)}%.${result.predictedWeight?" Try raising a prediction you think you can beat.":""}`
          : `${base} an average of <b>${req.toFixed(1)}%</b> on the remaining ${result.openWeight.toFixed(1)}% of the course.`;
        if(req!=null && req>0 && req<=100) needHint = Math.ceil(req);
      } else {
        // Nothing open, but not everything is actually marked yet — show
        // where the predictions currently project to land.
        const gap = target - result.projectedGrade;
        need = gap<=0
          ? `Your predictions put you at <b>${result.projectedGrade.toFixed(1)}%</b> (${letterGrade(result.projectedGrade)}). That reaches ${targetLetter}.`
          : `Your predictions put you at <b>${result.projectedGrade.toFixed(1)}%</b> (${letterGrade(result.projectedGrade)}), ${gap.toFixed(1)}% short of ${targetLetter}. You'd need about ${(gap*result.totalWeight/Math.max(1,result.predictedWeight)).toFixed(1)}% more on each predicted item.`;
      }

      return `<div class="grade-card" style="--c:var(--${colorVar}); --ct:var(--${colorVar}-tint);">
        <div class="grade-head">
          <span class="grade-course-name" style="color:var(--${colorVar})">${COURSE_NAMES[c]}</span>
          <span class="grade-current">${result.currentGrade!=null
            ? `<b>${result.currentGrade.toFixed(1)}%</b> <span class="grade-letter">${letterGrade(result.currentGrade)}</span>`
            : `<span style="color:var(--muted); font-size:12.5px;">No marks yet</span>`}</span>
        </div>
        <div class="grade-bar" aria-label="${result.earned.toFixed(1)}% earned, ${lost.toFixed(1)}% lost, ${result.predicted.toFixed(1)}% predicted, ${result.openWeight.toFixed(1)}% still open">
          <div class="grade-bar-earned" style="width:${pct(result.earned)}%"></div><div class="grade-bar-lost" style="width:${pct(lost)}%"></div><div class="grade-bar-pred" style="width:${pct(result.predicted)}%"></div>
        </div>
        <div class="grade-subline">${Math.round(result.gradedWeight)}% marked · ${Math.round(result.earned)}% earned${result.predictedWeight?` · ${Math.round(result.predictedWeight)}% predicted`:""}</div>
        <div class="grade-target-row">Aiming for
          <select data-target-course="${c}">${GRADE_TARGETS.map(([min,l])=>
            `<option value="${min}" ${min===target?"selected":""}>${l} (${min}%+)</option>`).join("")}</select>
        </div>
        <div class="grade-need">${need}</div>
        <div class="grade-cols-head"><span></span><span>Predicted</span><span>Actual</span></div>
        ${result.categories.map(cat=> `<div class="grade-cat">
          <div class="grade-cat-head">
            <span>${cat.name}${cat.bestOf?` (best ${cat.bestOf.count} of ${cat.bestOf.of})`:""}</span>
            <span>${Math.round(cat.totalWeight)}%</span>
          </div>
          ${cat.items.map(item=>gradeItemRowHtml(item, needHint)).join("")}
        </div>`).join("")}
      </div>`;
    }).join("") + `<div style="color:var(--muted); font-size:11.5px; padding:0 4px;">Letter grades use the Queen's grading scale. Your syllabus decides how marks are combined, so check it for drop-the-lowest rules or alternative grading schemes.</div>`;
    el.querySelectorAll("select[data-target-course]").forEach(sel=>{
      sel.addEventListener("change", ()=>{
        setTarget(sel.dataset.targetCourse, Number(sel.value));
        renderGrades();
      });
    });
    el.querySelectorAll(".grade-input:not(.pred)").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const raw = inp.value.trim();
        let val = raw==="" ? null : Number(raw);
        if(val!=null && !isNaN(val)) val = Math.max(0, Math.min(100, val));
        else if(val!=null) val = null; // non-numeric garbage — treat as cleared
        setGrade(inp.dataset.gradeid, val);
        renderGrades();
      });
    });
    el.querySelectorAll(".grade-input.pred").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const raw = inp.value.trim();
        let val = raw==="" ? null : Number(raw);
        if(val!=null && !isNaN(val)) val = Math.max(0, Math.min(100, val));
        else if(val!=null) val = null;
        setPredicted(inp.dataset.predictid, val);
        renderGrades();
      });
    });
  }

  // ---- now strip ----
  function renderNowStrip(){
    const el = document.getElementById("nowstrip");
    const now = new Date();
    const week = resolveWeekForDate(now);
    let html = "";

    if(week && !week.noClasses){
      const dayIdx = (now.getDay()+6)%7;
      const dayName = DAYS[dayIdx];
      const nowMin = now.getHours()*60 + now.getMinutes();
      const blocks = buildDayBlocks(week, dayName);
      let current=null, next=null;
      for(const b of blocks){
        const s=toMin(b[0]), e=toMin(b[1]);
        if(nowMin>=s && nowMin<e) current=b;
        if(nowMin<s && !next) next=b;
      }
      if(!next && dayIdx<6){
        const tBlocks = buildDayBlocks(week, DAYS[dayIdx+1]);
        if(tBlocks.length) next = tBlocks[0];
      }
      if(current){
        html += `<div class="now-pill current"><span class="now-label">Now</span> ${current[2]}<span class="mono">until ${fmt(current[1])}</span></div>`;
      }
      if(next){
        html += `<div class="now-pill next"><span class="now-label">Next</span> ${next[2]}<span class="mono">${fmt(next[0])}</span></div>`;
      }
      if(!current && !next){
        html += `<div class="now-pill">Day's done — rest up.</div>`;
      }
    } else {
      html += `<div class="now-pill">No fixed schedule today${week ? " ("+week.label+")" : ""}.</div>`;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = DEADLINES
      .map(item=>({ item, date: resolveDeadlineDate(item) }))
      .filter(x=> x.date && x.date>=today && !isDone(x.item.id))
      .sort((a,b)=> a.date-b.date);
    if(upcoming.length){
      const {item,date} = upcoming[0];
      const days = Math.round((date-today)/86400000);
      const when = days===0 ? "today" : days===1 ? "tomorrow" : `in ${days}d`;
      const courseName = COURSE_NAMES[item.course]||"";
      const label = item.text.indexOf(courseName)===0 ? item.text : (courseName+" "+item.text).trim();
      html += `<div class="now-pill deadline"><span class="now-label">Next due</span> ${label}<span class="mono">${when}</span></div>`;
    }

    el.innerHTML = html;
  }

  function refreshAll(){
    render(currentWeekId);
    renderTaskTodo();
    renderDue();
    renderNowStrip();
  }

  // ---- location modal ----
  // Room numbers (AUD, B201, etc.) don't geocode well on their own, so the maps
  // query uses just the building name + campus, while the room still shows in
  // the modal for you to find once you're in the building.
  const LOCATIONS = {
    "Stirling Hall AUD": "Stirling Hall, Queen's University, Kingston, ON",
    "Mackintosh-Corry Hall B201": "Mackintosh-Corry Hall, Queen's University, Kingston, ON",
    "Humphrey Hall AUD": "Humphrey Hall, Queen's University, Kingston, ON",
    "Stirling Hall B": "Stirling Hall, Queen's University, Kingston, ON",
    "Stirling Hall C": "Stirling Hall, Queen's University, Kingston, ON",
    "Ellis Hall AUD": "Ellis Hall, Queen's University, Kingston, ON",
    "Dunning Hall AUD": "Dunning Hall, Queen's University, Kingston, ON",
    "Biosciences Complex 2320": "Biosciences Complex, Queen's University, Kingston, ON",
  };
  // transit:// is a native-app URL scheme — only meaningful on a device that
  // could actually have the Transit app installed.
  function isMobileDevice(){
    return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  }
  function openLocationModal(label, location, date, start, end){
    openBlock = null;
    document.getElementById("modalTitle").textContent = label;
    document.getElementById("modalSub").textContent =
      (date ? date.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})+" · " : "") + fmt(start)+"–"+fmt(end);
    const dest = LOCATIONS[location]||location;
    const mapsUrl = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(dest);
    // Transit's documented URL scheme (transitapp.com/developers): transit://directions?to=...
    // Omitting "from" makes it use your current location as the origin.
    const transitUrl = "transit://directions?to="+encodeURIComponent(dest);
    document.getElementById("modalBody").innerHTML = `
      <div class="location-info">📍 ${location}</div>
      <div class="location-actions">
        <a class="location-btn" href="${mapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
        ${isMobileDevice() ? `<a class="location-btn" href="${transitUrl}">Open in Transit app</a>` : ""}
      </div>
    `;
    document.getElementById("modalBackdrop").hidden = false;
  }

  // ---- block detail modal ----
  let openBlock = null; // { date, start, end, label, tasks, fromPlan } | null

  // If the study plan (STUDY_PLAN) is what actually labelled this block,
  // the modal should show exactly that — not whatever the independent
  // auto-scheduler separately assigned to the same time slot, which is
  // what was happening before (the block said one thing, the modal showed
  // another). Falls back to the auto-scheduler only when the block has no
  // specific plan content of its own (e.g. a focus day's extra block
  // beyond its task count).
  function tasksFromPlanMeta(planMeta){
    if(!planMeta) return null;
    const plan = STUDY_PLAN[planMeta.key];
    if(!plan) return null;
    if(planMeta.kind==="focus"){
      if(!planMeta.taskIdxs || !planMeta.taskIdxs.length) return null;
      const courseLabel = COURSE_NAMES[plan.focus] || plan.focus;
      let out = planMeta.taskIdxs.map(i=> ({
        taskId: taskItemId(planMeta.key, i),
        text: plan.tasks[i],
        minutes: 0,
        item: { course: plan.focus, text: courseLabel+" — today's focus" },
      }));
      // This is the block carrying today's must-do (task index 0, starred
      // on the calendar) — also surface any undone carry-forward here,
      // exactly as shown at the top of the To-Do tab's focus group, so
      // the block and the To-Do tab always agree on today's full list.
      if(planMeta.taskIdxs.indexOf(0)!==-1 && planMeta.key===dateKey(new Date())){
        const carried = getCarriedTasks(planMeta.key).map(c=> ({
          taskId: c.taskId,
          text: `Carried over from ${new Date(c.fromKey+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})} — ${c.text}`,
          minutes: 0,
          item: { course: plan.focus, text: courseLabel+" — carried over" },
        }));
        out = carried.concat(out);
      }
      return out;
    }
    if(planMeta.kind==="slot"){
      if(!planMeta.slots || !planMeta.slots.length) return null;
      return planMeta.slots.map(slot=>{
        const entry = plan[slot];
        return {
          taskId: "studyplan-"+planMeta.key+"-"+slot,
          text: entry.task,
          minutes: 0,
          item: { course: entry.course, text: "Catch-up plan" },
        };
      });
    }
    return null;
  }
  function openBlockModal(date, start, end, label, planMeta){
    // Snapshot the task list once, on open — scheduleTasks() drops a task the
    // moment it's checked (correctly, for future scheduling), but re-querying it
    // on every render made a block's list shrink out from under you mid-session,
    // so an accidental tap looked like the item vanished with no way to undo.
    const planTasks = date ? tasksFromPlanMeta(planMeta) : null;
    const tasks = planTasks || (date ? (scheduleTasks()[date.toDateString()+"|"+start] || []) : null);
    openBlock = { date, start, end, label, tasks, fromPlan: !!planTasks };
    document.getElementById("modalBackdrop").hidden = false;
    renderBlockModal();
  }
  function closeBlockModal(){
    openBlock = null;
    document.getElementById("modalBackdrop").hidden = true;
  }
  function renderBlockModal(){
    if(!openBlock) return;
    const { date, start, end, label, tasks, fromPlan } = openBlock;
    document.getElementById("modalTitle").textContent = label;
    document.getElementById("modalSub").textContent =
      (date ? date.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})+" · " : "") + fmt(start)+"–"+fmt(end);

    const body = document.getElementById("modalBody");
    if(!date){
      body.innerHTML = `<div class="modal-empty">This is the standard-week template, not a specific date — pick a real week above to see what's planned for this block.</div>`;
      return;
    }
    if(!tasks || !tasks.length){
      body.innerHTML = `<div class="modal-empty">Nothing due soon enough to need this block yet — it's flexible time (or, if this is in the past, it's already gone by). Check back closer to your next deadline.</div>`;
      return;
    }
    const today = new Date(); today.setHours(0,0,0,0);
    body.innerHTML = tasks.map(t=>{
      const itemDate = resolveDeadlineDate(t.item);
      const daysUntil = itemDate ? Math.round((itemDate-today)/86400000) : null;
      const urgent = daysUntil!==null && daysUntil<=1;
      const done = isDone(t.taskId);
      const color = "var(--"+(COURSE_COLOR[t.item.course]||"class")+")";
      return `<label class="task-row${done?" done":""}">
        <input type="checkbox" data-taskid="${t.taskId}" ${done?"checked":""} style="accent-color:${color}">
        <span class="task-main">
          <span class="task-course" style="color:${color}">${COURSE_NAMES[t.item.course]||t.item.course} · ${t.item.text}${urgent?'<span class="task-urgent">priority</span>':""}</span>
          <span class="task-text">${t.text}</span>
        </span>
      </label>`;
    }).join("");
    // The "rest of this block is flexible" footer only makes sense for the
    // auto-scheduler's partial fills — a study-plan block's whole duration
    // already IS that task, not a prep item plus leftover free time.
    if(!fromPlan){
      const usedMin = tasks.reduce((sum,t)=> sum+t.minutes, 0);
      const blockMin = toMin(end)-toMin(start);
      if(blockMin-usedMin >= 20){
        body.innerHTML += `<div class="modal-empty">That's ~${usedMin} min scheduled — the rest of this block (${blockMin-usedMin} min) is flexible: buffer, review, or anything else not tracked here.</div>`;
      }
    }
    body.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const taskId = cb.dataset.taskid;
        if(taskId.indexOf("habit-")===0 || taskId.indexOf("studyplan-")===0){
          setDone(taskId, !isDone(taskId));
          refreshAll();
          renderBlockModal();
          return;
        }
        const [itemId, tIdx] = taskId.split("::t");
        const item = DEADLINES.find(d=>d.id===itemId);
        if(item) toggleTask(item, Number(tIdx));
      });
    });
  }
  document.getElementById("modalClose").addEventListener("click", closeBlockModal);
  document.getElementById("modalBackdrop").addEventListener("click", e=>{
    if(e.target.id==="modalBackdrop") closeBlockModal();
  });

  // ---- tabs ----
  document.getElementById("tabbar").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    [...document.querySelectorAll("#tabbar button")].forEach(b=> b.classList.toggle("active", b===btn));
    const tab = btn.dataset.tab;
    document.getElementById("view-cal").hidden = tab!=="cal";
    document.getElementById("view-todo").hidden = tab!=="todo";
    document.getElementById("view-due").hidden = tab!=="due";
    document.getElementById("view-grades").hidden = tab!=="grades";
    if(tab==="todo") renderTaskTodo();
    if(tab==="due") renderDue();
    if(tab==="grades") renderGrades();
  });

  document.getElementById("showUngraded").addEventListener("change", e=>{
    showUngraded = e.target.checked;
    try{ localStorage.setItem(SHOW_UNGRADED_KEY, showUngraded ? "1" : "0"); }catch(err){}
    renderDue();
  });

  const initialWeek = resolveWeekForDate(new Date());
  render(initialWeek ? initialWeek.id : "w2");
  renderTaskTodo();
  renderDue();
  renderGrades();
  renderNowStrip();
  setInterval(renderNowStrip, 30000);

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
      refreshNotifyUI();
    });
  }

  // ---- push notifications ----
  const VAPID_PUBLIC_KEY = "BHbOM4wC_ccYOS34nmXdPETLZ5EuLnYBGtteB2HMZBo4EG4g5qHJ4f3SYm9lyMweDynr8Ws1x7eLfeVRtDGNW5Q";
  function urlBase64ToUint8Array(base64String){
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
  }

  const notifyBtn = document.getElementById("notifyBtn");
  const notifyBox = document.getElementById("notifyBox");
  const notifySub = document.getElementById("notifySub");
  const notifyCopyBtn = document.getElementById("notifyCopyBtn");

  async function refreshNotifyUI(){
    if(!("serviceWorker" in navigator) || !("PushManager" in window) || !notifyBtn) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    notifyBtn.hidden = !!sub;
  }

  notifyBtn && notifyBtn.addEventListener("click", async ()=>{
    try{
      const perm = await Notification.requestPermission();
      if(perm !== "granted"){ alert("Notifications permission was not granted."); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      notifySub.value = JSON.stringify(sub.toJSON());
      notifyBox.hidden = false;
      notifyBtn.hidden = true;
    }catch(err){
      alert("Couldn't enable notifications: "+err.message);
    }
  });

  notifyCopyBtn && notifyCopyBtn.addEventListener("click", ()=>{
    notifySub.select();
    if(navigator.clipboard) navigator.clipboard.writeText(notifySub.value).catch(()=>{});
    notifyCopyBtn.textContent = "Copied!";
    setTimeout(()=>{ notifyCopyBtn.textContent = "Copy"; }, 1500);
  });
})();
</script>
