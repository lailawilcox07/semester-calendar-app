<meta charset="UTF-8">
<title>Semester Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#355E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Semester Calendar">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-512.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#F7F4EE;
    --surface:#FFFFFF;
    --ink:#24211D;
    --muted:#8A8377;
    --line:#E3DFD6;
    --class:#E8600C;
    --class-tint:#FBE3D2;
    --study:#B07A2C;
    --study-tint:#F5E9D7;
    --commute:#3D6E96;
    --commute-tint:#E1EAF1;
    --sport:#C23B2E;
    --sport-tint:#F6E1DE;
    --sleep:#6B5670;
    --sleep-tint:#EBE5EC;
    --meal:#4A8B57;
    --meal-tint:#E3EFE4;
    --break:#26415F;
    --break-tint:#E3E7EC;
    --therapy:#CC4488;
    --therapy-tint:#F8E1EC;
    --downtime:#A85B6E;
    --downtime-tint:#F2E3E6;
    --flag:#B23A48;
    --flag-tint:#F6E0E1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1916; --surface:#242220; --ink:#EDE9E2; --muted:#A69E8F; --line:#3A362F;
      --class:#F5975C; --class-tint:#3D2311;
      --study:#E0A855; --study-tint:#3A2E1C;
      --commute:#8FB8D9; --commute-tint:#22323F;
      --sport:#E8776A; --sport-tint:#3D2420;
      --sleep:#C7A9CC; --sleep-tint:#332B37;
      --meal:#8FC79A; --meal-tint:#24352A;
      --break:#7FA5C9; --break-tint:#1E2C3A;
      --therapy:#E599C4; --therapy-tint:#3A2530;
      --downtime:#D99BAC; --downtime-tint:#3A262B;
      --flag:#F0798A;
      --flag-tint:#3D2224;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1916; --surface:#242220; --ink:#EDE9E2; --muted:#A69E8F; --line:#3A362F;
    --class:#F5975C; --class-tint:#3D2311;
    --study:#E0A855; --study-tint:#3A2E1C;
    --commute:#8FB8D9; --commute-tint:#22323F;
    --sport:#E8776A; --sport-tint:#3D2420;
    --sleep:#C7A9CC; --sleep-tint:#332B37;
    --meal:#8FC79A; --meal-tint:#24352A;
    --break:#7FA5C9; --break-tint:#1E2C3A;
    --therapy:#E599C4; --therapy-tint:#3A2530;
    --downtime:#D99BAC; --downtime-tint:#3A262B;
    --flag:#F0798A;
    --flag-tint:#3D2224;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Work Sans", -apple-system, sans-serif;
    padding-inline:16px; padding-block:20px 40px;
  }
  h1{font-family:"Fraunces", Georgia, serif; margin:0; text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px; margin:0 auto;}

  header.page{margin-bottom:18px;}
  header.page .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  header.page h1{font-size:clamp(26px,4vw,36px); font-weight:600;}

  /* ---- now strip ---- */
  .nowstrip{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .now-pill{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; font-size:13px; display:flex; align-items:center; gap:8px; flex:1 1 220px;
    line-height:1.3;
  }
  .now-pill .now-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    background:var(--class-tint); color:var(--class); padding:3px 6px; border-radius:5px; flex:none;
  }
  .now-pill.next .now-label{background:var(--study-tint); color:var(--study);}
  .now-pill.deadline{border-color:var(--flag);}
  .now-pill.deadline .now-label{background:var(--flag); color:#fff;}
  .now-pill .mono{margin-left:auto; color:var(--muted); font-size:12px; flex:none;}
  .now-pill.deadline .mono{color:var(--flag); font-weight:600;}

  /* ---- tabs ---- */
  .tabbar{display:flex; gap:6px; margin-bottom:16px;}
  .tabbar button{
    flex:1; font-family:"Work Sans",sans-serif; font-size:13px; font-weight:600;
    padding:10px 8px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; transition:background .12s,color .12s,border-color .12s;
  }
  .tabbar button.active{background:var(--class); color:var(--surface); border-color:var(--class);}

  /* ---- notifications ---- */
  .notify-btn{
    font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; margin-bottom:12px;
  }
  .notify-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:14px; font-size:13px;
  }
  .notify-box p{margin:0 0 8px; color:var(--muted);}
  .notify-box textarea{
    width:100%; height:90px; font-family:"IBM Plex Mono",monospace; font-size:11px;
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:8px; box-sizing:border-box; resize:vertical;
  }
  .notify-box button{
    margin-top:8px; font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600;
    padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--class);
    color:var(--surface); cursor:pointer;
  }

  .legend{
    display:flex; flex-wrap:wrap; gap:10px 18px; margin:0 0 22px;
    padding:12px 16px; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  }
  .legend .item{display:flex; align-items:center; gap:7px; font-size:12.5px;}
  .legend .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
  .legend .swatch.flagged{background:transparent; border:2px dashed var(--flag); width:10px; height:10px;}

  .weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .weekbar::-webkit-scrollbar{height:6px;}
  .weekbar::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .weekbar button{
    flex:none; font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .12s,color .12s,border-color .12s;
  }
  .weekbar button:hover{border-color:var(--class);}
  .weekbar button.active{background:var(--class); color:var(--surface); border-color:var(--class);}

  .weeknote{
    background:var(--study-tint); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.55;
  }
  .weeknote b{color:var(--study);}

  .gridscroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); -webkit-overflow-scrolling:touch;}
  .calwrap{display:flex; min-width:1030px;}

  /* ---- agenda (phone) view of the calendar — a day-by-day list instead of
     the grid, ported from queens-semester-calendar's Calendar tab. Below
     900px this replaces the grid entirely (it still exists in the DOM,
     just hidden, so nothing needs re-rendering when the window resizes). ---- */
  .gridscroll{display:none;}
  .agenda{display:flex; flex-direction:column; gap:4px;}
  @media (min-width:900px){ .agenda{display:none;} .gridscroll{display:block;} }
  .ag-day{margin-bottom:16px;}
  .ag-day h4{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 8px;
    font-family:"Fraunces",serif; font-size:15px; font-weight:600;
  }
  .ag-day.today h4{color:var(--class);}
  .ag-today-tag, .ag-break-tag{
    font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px; font-family:"Work Sans",sans-serif;
  }
  .ag-today-tag{background:var(--class); color:var(--surface);}
  .ag-break-tag{background:var(--study-tint); color:var(--study);}
  .ag-duewrap{display:flex; flex-wrap:wrap; gap:0; margin-bottom:6px;}
  .ag-day .duetag{margin:0 6px 6px 0;}
  .ag-item{
    display:flex; gap:12px; align-items:center; background:var(--ct); border-left:4px solid var(--c);
    border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:13.5px;
  }
  .ag-item.study{background:var(--surface); border:1px dashed var(--c); border-left:4px solid var(--c);}
  .ag-item.exam{background:var(--flag); border-left-color:var(--flag);}
  .ag-item.exam b, .ag-item.exam .ag-time{color:var(--surface);}
  .ag-item.flagged{border-style:dashed; border-color:var(--flag);}
  .ag-item.done{opacity:.5;}
  .ag-item.done b{text-decoration:line-through;}
  .ag-time{font-size:10.5px; color:var(--muted); min-width:46px; line-height:1.3; flex:none; font-variant-numeric:tabular-nums;}
  .ag-item.exam .ag-time{color:var(--surface); opacity:.85;}
  .ag-body{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
  .ag-body b{color:var(--c); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ag-check{width:16px; height:16px; flex:none; accent-color:var(--c); cursor:pointer;}
  .ag-loc{font-size:11px; flex:none;}
  .ag-empty{color:var(--muted); font-size:12.5px; margin:0 0 6px;}

  .timecol{flex:0 0 54px; position:sticky; left:0; z-index:4; background:var(--surface); border-right:1px solid var(--line);}
  .daycol{flex:1 1 0; min-width:138px; position:relative; border-right:1px solid var(--line);}
  .daycol:last-child{border-right:none;}

  .headrow{display:flex; position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:2px solid var(--line);}
  .headcell{flex:1 1 0; min-width:138px; padding:10px 8px 12px; border-right:1px solid var(--line);}
  .headcell:last-child{border-right:none;}
  .headcell.timehead{flex:0 0 54px; min-width:54px; position:sticky; left:0; z-index:6; background:var(--surface);}
  .dayname{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .daydate{font-family:"Fraunces",serif; font-size:17px; margin-top:2px;}
  .duewrap{display:flex; flex-direction:column; gap:3px; margin-top:7px;}
  .duetag{
    display:flex; align-items:center; gap:5px; font-size:10.5px; line-height:1.3; padding:3px 6px 3px 5px;
    border-radius:5px; background:var(--flag); color:#fff; font-weight:600; cursor:pointer;
  }
  .duetag input{width:12px; height:12px; flex:none; accent-color:#fff; cursor:pointer;}
  .duetag.done{opacity:.5;}
  .duetag.done span{text-decoration:line-through;}

  .bodyrow{display:flex;}
  .timeline-bg{background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hr));}
  .hourlabel{position:absolute; right:6px; font-size:10px; color:var(--muted); transform:translateY(-6px);}

  .block{
    position:absolute; left:3px; right:3px; border-radius:7px; padding:5px 7px; font-size:11.5px; line-height:1.28;
    overflow:hidden; border:1px solid transparent; box-sizing:border-box;
  }
  .block .t{display:block; font-size:9px; opacity:.75; font-variant-numeric:tabular-nums;}
  .block .l{display:block; font-weight:600;}
  .block.compact{display:flex; align-items:center; gap:4px; padding:2px 6px;}
  .block.compact .l{display:inline; font-size:10.5px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .block.compact .block-check{margin:0; flex:none;}
  .block.class{background:var(--class-tint); color:var(--class); border-color:var(--class); border-width:2px;}
  .block.study{background:var(--study-tint); color:var(--study); border-color:var(--study);}
  .block.commute{background:var(--commute-tint); color:var(--commute); border-color:var(--commute);}
  .block.sport{background:var(--sport-tint); color:var(--sport); border-color:var(--sport);}
  .block.sleep{background:var(--sleep-tint); color:var(--sleep); border-color:var(--sleep);}
  .block.meal{background:var(--meal-tint); color:var(--meal); border-color:var(--meal);}
  .block.break{background:var(--break-tint); color:var(--break); border-color:var(--break);}
  .block.therapy{background:var(--therapy-tint); color:var(--therapy); border-color:var(--therapy);}
  .block.downtime{background:var(--downtime-tint); color:var(--downtime); border-color:var(--downtime);}
  .block.exam{background:var(--flag); color:#fff; border-color:var(--flag);}
  .block.flagged{border:2px dashed var(--flag) !important;}
  .block.flagged .l::before{content:"⚑ ";}
  .block-check{width:13px; height:13px; margin:0 4px 0 0; vertical-align:-2px; accent-color:currentColor; cursor:pointer;}
  .block.done{opacity:.5;}
  .block.done .l{text-decoration:line-through;}

  /* ---- due tab (queens-semester-calendar style: grouped by recency,
     course filter chips, status-cycle button) ---- */
  .due-filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .due-chip{
    font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600; padding:6px 12px;
    border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .due-chip .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .due-group{margin-bottom:16px;}
  .due-group-head{font-size:13px; font-weight:700; margin:0 2px 6px;}
  .due-group-head .count{color:var(--muted); font-weight:500;}
  .due-group.overdue .due-group-head{color:var(--flag);}
  .due-rows{list-style:none; padding:0; margin:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .due-row{display:grid; grid-template-columns:8px 1fr auto auto; gap:10px; align-items:center; padding:10px 12px; border-top:1px solid var(--line);}
  .due-row:first-child{border-top:none;}
  .due-row .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .due-main{display:flex; flex-direction:column; font-size:13.5px; min-width:0;}
  .due-meta{font-size:11.5px; color:var(--muted);}
  .due-row.st-done .due-main{text-decoration:line-through; opacity:.55;}
  .due-weight{font-size:11px; color:var(--muted); white-space:nowrap;}
  .status-btn{
    font-family:"Work Sans",sans-serif; font-size:11px; font-weight:700; border-radius:999px; padding:5px 10px;
    min-width:84px; text-align:center; border:1px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer;
  }
  .status-btn.st-started{background:var(--study-tint); border-color:var(--study); color:var(--study);}
  .status-btn.st-done{background:var(--meal-tint); border-color:var(--meal); color:var(--meal);}
  .due-show-done{
    font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600; color:var(--muted);
    background:none; border:none; cursor:pointer; padding:6px 2px; text-decoration:underline; text-decoration-style:dotted;
  }
  @media (max-width:480px){
    .due-row{grid-template-columns:8px 1fr auto;}
    .status-btn{grid-column:2/4; justify-self:start; margin-top:2px;}
  }

  /* ---- to-do tab: card sections (queens-semester-calendar style) ---- */
  .section-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px;}
  .section-card > h3{font-family:"Fraunces",serif; font-size:15px; font-weight:600; margin:0 0 8px;}
  .section-card .task-group{margin-bottom:0;}
  .section-sum-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .section-sum-head h3{margin:0;}
  .bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:8px 0 2px;}
  .bar-fill{height:100%; background:var(--class); border-radius:4px; transition:width .2s;}

  /* ---- todo / progress ---- */
  .ungraded-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
    margin-bottom:12px; cursor:pointer; user-select:none;
  }
  .switch{position:relative; display:inline-block; width:34px; height:20px; flex:none;}
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .switch-track{
    position:absolute; inset:0; border-radius:999px; background:var(--line);
    transition:background .15s;
  }
  .switch-track::before{
    content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s;
  }
  .switch input:checked + .switch-track{background:var(--class);}
  .switch input:checked + .switch-track::before{transform:translateX(14px);}
  .todolist{display:flex; flex-direction:column;}
  .todo-row{
    display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--surface);
    border:1px solid var(--line); border-radius:9px; margin-bottom:6px; font-size:13.5px; cursor:pointer;
  }
  .todo-row input[type=checkbox]{width:17px; height:17px; flex:none; cursor:pointer;}
  .todo-text{flex:1;}
  .todo-text[data-id]{cursor:pointer;}
  .todo-text[data-id]:hover{text-decoration:underline; text-decoration-style:dotted;}
  .todo-date{font-size:11.5px; color:var(--muted); flex:none; white-space:nowrap;}
  .todo-row.done{opacity:.5;}
  .todo-row.done .todo-text{text-decoration:line-through;}

  .todo-row.started .todo-text::before{content:"In progress — "; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--study); opacity:.85;}
  .todo-empty{color:var(--muted); font-size:13.5px; padding:20px 4px;}

  .task-group{margin-bottom:14px;}
  .task-group-head{
    display:flex; align-items:baseline; gap:8px; font-size:13.5px; font-weight:700; margin:0 4px 6px;
  }
  .task-group-head .todo-date{font-weight:400;}
  .task-group .todo-row{margin-left:14px; padding:8px 12px; font-size:12.5px;}
  .task-group .todo-row input[type=checkbox]{width:15px; height:15px;}

  /* ---- grades tab ---- */
  .gradeslist{display:flex; flex-direction:column; gap:14px;}
  .grade-card{background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:14px 16px;}
  .grade-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; gap:10px; flex-wrap:wrap;}
  .grade-course-name{font-family:"Fraunces",serif; font-size:16px; font-weight:600;}
  .grade-current{font-size:15px; display:flex; align-items:baseline; gap:6px;}
  .grade-current b{font-family:"IBM Plex Mono",monospace; font-weight:700;}
  .grade-letter{font-family:"Fraunces",serif; font-weight:600; font-size:13px; background:var(--ct); color:var(--c); border-radius:6px; padding:1px 7px;}
  .grade-bar{display:flex; height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin:6px 0 8px;}
  .grade-bar-earned{background:var(--c);}
  .grade-bar-lost{background:var(--flag); opacity:.5;}
  .grade-bar-pred{background:repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); opacity:.6;}
  .grade-subline{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .grade-target-row{margin:2px 0 6px; font-size:13px;}
  .grade-target-row select{
    font-family:"Work Sans",sans-serif; font-size:12.5px; margin-left:6px; padding:3px 6px;
    border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink);
  }
  .grade-need{font-size:12.5px; background:var(--bg); border-radius:8px; padding:8px 10px; margin:0 0 6px; line-height:1.4;}
  .grade-cols-head{
    display:flex; justify-content:flex-end; gap:14px; font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); font-weight:700; padding:0 0 2px;
  }
  .grade-cols-head span{width:84px; text-align:right;}
  .grade-cat{margin-top:10px;}
  .grade-cat-head{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:5px;}
  .grade-item{padding:7px 0; font-size:13px; border-top:1px solid var(--line);}
  .grade-item:first-child{border-top:none;}
  .grade-item-top{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
  .grade-item-label{flex:1;}
  .grade-item-weight{font-size:11px; color:var(--muted); flex:none; white-space:nowrap;}
  .grade-badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:2px 7px; border-radius:999px; flex:none; white-space:nowrap;
  }
  .grade-badge.entered{background:var(--meal-tint); color:var(--meal);}
