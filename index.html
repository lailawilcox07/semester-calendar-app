<style>
  :root{
    --bg:#F7F4EE;
    --surface:#FFFFFF;
    --ink:#24211D;
    --muted:#8A8377;
    --line:#E3DFD6;
    --class:#355E56;
    --class-tint:#E4ECE9;
    --study:#B07A2C;
    --study-tint:#F5E9D7;
    --commute:#55677E;
    --commute-tint:#E7EAEF;
    --sport:#A2492F;
    --sport-tint:#F3E2DB;
    --sleep:#6B5670;
    --sleep-tint:#EBE5EC;
    --personal:#6E7F52;
    --personal-tint:#E9EDE2;
    --flag:#B23A48;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1916; --surface:#242220; --ink:#EDE9E2; --muted:#A69E8F; --line:#3A362F;
      --class:#7FB3A6; --class-tint:#26332F;
      --study:#E0A855; --study-tint:#3A2E1C;
      --commute:#9AB0CB; --commute-tint:#28303B;
      --sport:#E08064; --sport-tint:#3A2621;
      --sleep:#C7A9CC; --sleep-tint:#332B37;
      --personal:#B7CB93; --personal-tint:#2B3122;
      --flag:#F0798A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1916; --surface:#242220; --ink:#EDE9E2; --muted:#A69E8F; --line:#3A362F;
    --class:#7FB3A6; --class-tint:#26332F;
    --study:#E0A855; --study-tint:#3A2E1C;
    --commute:#9AB0CB; --commute-tint:#28303B;
    --sport:#E08064; --sport-tint:#3A2621;
    --sleep:#C7A9CC; --sleep-tint:#332B37;
    --personal:#B7CB93; --personal-tint:#2B3122;
    --flag:#F0798A;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Work Sans", -apple-system, sans-serif;
    padding-inline:16px; padding-block:20px 40px;
  }
  h1{font-family:"Fraunces", Georgia, serif; margin:0; text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px; margin:0 auto;}

  header.page{margin-bottom:18px;}
  header.page .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  header.page h1{font-size:clamp(26px,4vw,36px); font-weight:600;}

  /* ---- now strip ---- */
  .nowstrip{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .now-pill{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; font-size:13px; display:flex; align-items:center; gap:8px; flex:1 1 220px;
    line-height:1.3;
  }
  .now-pill .now-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    background:var(--class-tint); color:var(--class); padding:3px 6px; border-radius:5px; flex:none;
  }
  .now-pill.next .now-label{background:var(--study-tint); color:var(--study);}
  .now-pill.deadline{border-color:var(--flag);}
  .now-pill.deadline .now-label{background:var(--flag); color:#fff;}
  .now-pill .mono{margin-left:auto; color:var(--muted); font-size:12px; flex:none;}
  .now-pill.deadline .mono{color:var(--flag); font-weight:600;}

  /* ---- tabs ---- */
  .tabbar{display:flex; gap:6px; margin-bottom:16px;}
  .tabbar button{
    flex:1; font-family:"Work Sans",sans-serif; font-size:13px; font-weight:600;
    padding:10px 8px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; transition:background .12s,color .12s,border-color .12s;
  }
  .tabbar button.active{background:var(--class); color:var(--surface); border-color:var(--class);}

  .legend{
    display:flex; flex-wrap:wrap; gap:10px 18px; margin:0 0 22px;
    padding:12px 16px; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  }
  .legend .item{display:flex; align-items:center; gap:7px; font-size:12.5px;}
  .legend .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
  .legend .swatch.flagged{background:transparent; border:2px dashed var(--flag); width:10px; height:10px;}

  .weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .weekbar::-webkit-scrollbar{height:6px;}
  .weekbar::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .weekbar button{
    flex:none; font-family:"Work Sans",sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .12s,color .12s,border-color .12s;
  }
  .weekbar button:hover{border-color:var(--class);}
  .weekbar button.active{background:var(--class); color:var(--surface); border-color:var(--class);}

  .weeknote{
    background:var(--study-tint); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.55;
  }
  .weeknote b{color:var(--study);}

  .gridscroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); -webkit-overflow-scrolling:touch;}
  .calwrap{display:flex; min-width:1030px;}

  .timecol{flex:0 0 54px; position:sticky; left:0; z-index:4; background:var(--surface); border-right:1px solid var(--line);}
  .daycol{flex:1 1 0; min-width:138px; position:relative; border-right:1px solid var(--line);}
  .daycol:last-child{border-right:none;}

  .headrow{display:flex; position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:2px solid var(--line);}
  .headcell{flex:1 1 0; min-width:138px; padding:10px 8px 12px; border-right:1px solid var(--line);}
  .headcell:last-child{border-right:none;}
  .headcell.timehead{flex:0 0 54px; min-width:54px; position:sticky; left:0; z-index:6; background:var(--surface);}
  .dayname{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .daydate{font-family:"Fraunces",serif; font-size:17px; margin-top:2px;}
  .duewrap{display:flex; flex-direction:column; gap:3px; margin-top:7px;}
  .duetag{
    display:flex; align-items:center; gap:5px; font-size:10.5px; line-height:1.3; padding:3px 6px 3px 5px;
    border-radius:5px; background:var(--flag); color:#fff; font-weight:600; cursor:pointer;
  }
  .duetag input{width:12px; height:12px; flex:none; accent-color:#fff; cursor:pointer;}
  .duetag.done{opacity:.5;}
  .duetag.done span{text-decoration:line-through;}

  .bodyrow{display:flex;}
  .timeline-bg{background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hr));}
  .hourlabel{position:absolute; right:6px; font-size:10px; color:var(--muted); transform:translateY(-6px);}

  .block{
    position:absolute; left:3px; right:3px; border-radius:7px; padding:5px 7px; font-size:11.5px; line-height:1.28;
    overflow:hidden; border:1px solid transparent; box-sizing:border-box;
  }
  .block .t{display:block; font-size:9px; opacity:.75; font-variant-numeric:tabular-nums;}
  .block .l{display:block; font-weight:600;}
  .block.class{background:var(--class-tint); color:var(--class); border-color:var(--class);}
  .block.study{background:var(--study-tint); color:var(--study); border-color:var(--study);}
  .block.commute{background:var(--commute-tint); color:var(--commute); border-color:var(--commute);}
  .block.sport{background:var(--sport-tint); color:var(--sport); border-color:var(--sport);}
  .block.sleep{background:var(--sleep-tint); color:var(--sleep); border-color:var(--sleep);}
  .block.personal{background:var(--personal-tint); color:var(--personal); border-color:var(--personal);}
  .block.exam{background:var(--flag); color:#fff; border-color:var(--flag);}
  .block.flagged{border:2px dashed var(--flag) !important;}
  .block.flagged .l::before{content:"⚑ ";}
  .block-check{width:13px; height:13px; margin:0 4px 0 0; vertical-align:-2px; accent-color:currentColor; cursor:pointer;}
  .block.done{opacity:.5;}
  .block.done .l{text-decoration:line-through;}

  /* ---- todo / progress ---- */
  .todolist{display:flex; flex-direction:column;}
  .todo-row{
    display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--surface);
    border:1px solid var(--line); border-radius:9px; margin-bottom:6px; font-size:13.5px; cursor:pointer;
  }
  .todo-row input[type=checkbox]{width:17px; height:17px; flex:none; cursor:pointer;}
  .todo-row.small{padding:8px 10px; font-size:12.5px; margin-bottom:4px;}
  .todo-row.small input[type=checkbox]{width:15px; height:15px;}
  .todo-course{font-size:11px; font-weight:700; letter-spacing:.02em; flex:none; min-width:62px;}
  .todo-text{flex:1;}
  .todo-date{font-size:11.5px; color:var(--muted); flex:none; white-space:nowrap;}
  .todo-weight{font-size:11px; color:var(--muted); flex:none; white-space:nowrap; opacity:.85;}
  .todo-row.done{opacity:.5;}
  .todo-row.done .todo-text{text-decoration:line-through;}
  .todo-row.overdue .todo-date{color:var(--flag); font-weight:600;}
  .todo-empty{color:var(--muted); font-size:13.5px; padding:20px 4px;}
  .todo-divider{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin:16px 4px 8px;}

  .proglist{display:flex; flex-direction:column; gap:14px;}
  .course-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .course-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px;}
  .course-name{font-family:"Fraunces",serif; font-size:16px; font-weight:600;}
  .course-count{font-size:12.5px; color:var(--muted); flex:none;}
  .course-bar-track{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:10px;}
  .course-bar-fill{height:100%; border-radius:3px; transition:width .2s;}
  .course-items{display:flex; flex-direction:column;}

  /* ---- block detail modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-backdrop[hidden]{ display:none; }
  @media (min-width:600px){ .modal-backdrop{ align-items:center; } }
  .modal{
    background:var(--surface); width:100%; max-width:480px; max-height:82vh;
    border-radius:16px 16px 0 0; overflow:auto; box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  @media (min-width:600px){ .modal{ border-radius:16px; max-height:80vh; } }
  .modal-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:16px 16px 12px; position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .modal-title{font-family:"Fraunces",serif; font-size:18px; font-weight:600;}
  .modal-sub{font-size:12px; color:var(--muted); margin-top:3px;}
  .modal-close{
    flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); font-size:18px; line-height:1; cursor:pointer;
  }
  .modal-body{padding:14px 16px 20px;}
  .modal-empty{color:var(--muted); font-size:13.5px; padding:10px 2px;}
  .task-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{width:18px; height:18px; margin-top:1px; flex:none; cursor:pointer;}
  .task-row.done{opacity:.5;}
  .task-row.done .task-text{text-decoration:line-through;}
  .task-main{flex:1;}
  .task-course{font-size:10.5px; font-weight:700; letter-spacing:.02em; display:block; margin-bottom:2px;}
  .task-text{font-size:13.5px; line-height:1.4;}
  .task-urgent{
    display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    background:var(--flag); color:#fff; padding:2px 5px; border-radius:4px; margin-left:6px; vertical-align:1px;
  }
</style>

  <div id="view-cal">

  </div>

  <div id="view-todo" hidden>
    <div class="todolist" id="todolist"></div>

  <div id="view-prog" hidden>

</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>

</div>

  function detectCourse(text){
    text = text || "";
    if(text.indexOf("MATH 225")!==-1) return "MATH225";
    if(text.indexOf("MATH 112")!==-1) return "MATH112";
    if(text.indexOf("BIOL")!==-1) return "BIOL102";
    if(text.indexOf("COGS")!==-1) return "COGS100";
    if(text.indexOf("PHYS")!==-1) return "PHYS242";
    return "OTHER";
  }
  function stripPart(s){ return s.replace(/\s*\(Part\s*\d+\)\s*$/i,"").trim(); }

  // ---- deadlines are derived from the weeks[] data above, not re-typed, so editing a
  // due{} entry or an override (including its weight — % of the course grade it's
  // worth) updates the calendar, the to-do tab, priority order and progress together.
  function buildDeadlines(){
    const items = [];
    const seenOv = new Set();
    // A due{} entry already covering a lab-in-person session or a midterm (e.g.
    // "BIOL Lab 1B (in-person)", "BIOL 102 MIDTERM · 11am–1pm") means the matching
    // "flag the block" override/satOverride describes the same real-world deadline
    // — skip that copy so it isn't double-counted.
    const dueCovered = new Set();
    weeks.forEach(week=>{
      Object.keys(week.due||{}).forEach(day=>{
        (week.due[day]||[]).forEach(entry=>{
          const text = entry.text;
          if(/lab/i.test(text)) dueCovered.add(week.id+"|"+day+"|lab");
          if(/midterm/i.test(text)) dueCovered.add(week.id+"|"+day+"|exam");
          if(/quiz/i.test(text)) dueCovered.add(week.id+"|"+day+"|quiz");
        });
      });
    });
    weeks.forEach(week=>{
      Object.keys(week.due||{}).forEach(day=>{
        (week.due[day]||[]).forEach((entry,idx)=>{
          const text = entry.text;
          const course = detectCourse(text);
          const kind = /midterm/i.test(text) ? "exam" : /quiz/i.test(text) ? "quiz" : /lab/i.test(text) ? "lab" : "task";
          items.push({ id:"due-"+week.id+"-"+day+"-"+idx, weekId:week.id, day, date:null, text, course, kind, weight:entry.weight||0 });
        });
      });
      (week.overrides||[]).forEach(ov=>{
        if(!ov.flag && !ov.exam) return;
        const kind = ov.exam ? "exam" : /lab/i.test(ov.match||"") ? "lab" : "quiz";
        if(dueCovered.has(week.id+"|"+ov.day+"|"+kind)) return;
        const rawText = ov.newLabel ? stripPart(ov.newLabel) : ((ov.match||"") + (ov.append||""));
        const course = detectCourse(ov.match || ov.newLabel || "");
        const dedupKey = week.id+"|"+course+"|"+kind+"|"+rawText;
        if(seenOv.has(dedupKey)) return;
        seenOv.add(dedupKey);
        items.push({ id:"ov-"+dedupKey, weekId:week.id, day:ov.day, date:null, text:rawText, course, kind, weight:ov.weight||0 });
      });
      if(week.satOverride && !dueCovered.has(week.id+"|Sat|exam")){
        const so = week.satOverride;
        items.push({ id:"sat-"+week.id, weekId:week.id, day:"Sat", date:null, text:so.label, course:detectCourse(so.label), kind:"exam", weight:so.weight||0 });
      }
    });
    Object.keys(COURSE_NAMES).forEach(c=>{
      const d = examDates[c];
      items.push({ id:"final-"+c, weekId:"exam", day:null, date:d||null, text:COURSE_NAMES[c]+" Final Exam", course:c, kind:"final", tba:!d, weight:FINAL_WEIGHT[c]||0 });
    });
    return items;
  }
  function resolveDeadlineDate(item){
    if(item.date) return item.date;
    if(!item.day) return null;
    const week = weeks.find(w=>w.id===item.weekId);
    if(!week || !week.dates) return null;
    const idx = DAYS.indexOf(item.day);
    if(idx<0) return null;
    return week.dates[idx];
  }

  // ---- auto-scheduler: fills upcoming study blocks with the highest-priority
  // pending tasks that fit, recomputed fresh every render so anything left
  // unchecked when a block ends automatically flows into the next open block.
  function getUpcomingStudyBlocks(horizonDays){
    const now = new Date();
    const blocks = [];
    for(let d=0; d<=horizonDays; d++){
      const date = new Date(now); date.setDate(now.getDate()+d); date.setHours(0,0,0,0);
      const week = resolveWeekForDate(date) || weeks.find(w=>w.id==="std");
      const dayIdx = (date.getDay()+6)%7;
      const dayName = DAYS[dayIdx];
      const dayStudyBlocks = buildDayBlocks(week, dayName).filter(b=>b[3]==="study");
      dayStudyBlocks.forEach((b,bi)=>{
        const [start,end] = b;
        const [sh,sm] = start.split(":").map(Number);
        const [eh,em] = end.split(":").map(Number);
        const blockStart = new Date(date); blockStart.setHours(sh,sm,0,0);
        const blockEnd = new Date(date); blockEnd.setHours(eh,em,0,0);
        if(blockEnd <= now) return;
        const capacityStart = blockStart < now ? now : blockStart;
        const capacityMin = Math.round((blockEnd-capacityStart)/60000);
        if(capacityMin <= 0) return;
        blocks.push({ date, start, end, capacityMin, blockKey: date.toDateString()+"|"+start, isLastOfDay: bi===dayStudyBlocks.length-1 });
      });
    }
    return blocks;
  }
  // How many days before its due date a task is allowed to be scheduled at all,
  // so blocks near "now" don't get crammed with prep for things weeks away —
  // there's simply far more study-block capacity than task content, so a naive
  // fill-blocks-in-order pass front-loads the entire term into the first few days.
  function leadDays(item){
    if(item.kind==="final") return 35;
    if(item.kind==="exam") return 21;
    return 10;
  }
  // Cap how much gets scheduled into any single sitting. Without this, a long block
  // (e.g. a 3+ hour Saturday block) would swallow several deadlines' worth of prep
  // in one sitting, which — combined with there being far more block capacity than
  // task content overall — front-loads the whole term into the first few days.
  // Anything past this cap is left as flexible time, not force-filled.
  const SESSION_CAP_MIN = 90;
  // Habits get their own, smaller pool of leftover capacity per block — kept separate
  // from SESSION_CAP_MIN so a block that's already full of deadline prep doesn't also
  // get buried in habit items, but a block with room still gets a realistic amount.
  const HABIT_CAP_MIN = 45;
  function scheduleTasks(){
    const consumed = new Set(); // taskIds placed already, this computation
    const assignment = {};
    const blocks = getUpcomingStudyBlocks(110);
    const undone = DEADLINES.filter(i=>!isDone(i.id));
    const byPriority = [...undone].sort((a,b)=> priorityScore(b)-priorityScore(a));

    function fillFrom(list, block, remaining, picked, windowOnly){
      for(const item of list){
        if(remaining.v<=0) break;
        if(windowOnly){
          const date = resolveDeadlineDate(item);
          if(date){
            const daysAhead = Math.round((date-block.date)/86400000);
            if(daysAhead > leadDays(item)) continue; // not eligible yet at this block's date
          }
        }
        const tasks = getTasks(item);
        for(let idx=0; idx<tasks.length; idx++){
          if(remaining.v<=0) break;
          const taskId = item.id+"::t"+idx;
          if(isDone(taskId) || consumed.has(taskId)) continue;
          if(tasks[idx].minutes<=remaining.v){
            picked.push({ taskId, text:tasks[idx].text, minutes:tasks[idx].minutes, item });
            consumed.add(taskId);
            remaining.v -= tasks[idx].minutes;
          }
        }
      }
    }

    function fillHabits(block, budget, picked){
      // daily Anki goes first, and only at the end of the day: it's small, resets if
      // missed rather than banking up, so it shouldn't lose out to a bulkier weekly item
      if(block.isLastOfDay){
        for(const h of DAILY_HABITS){
          if(budget.v<=0) break;
          if(h.minutes>budget.v) continue;
          const id = "habit-d-"+h.course+"-"+block.date.toDateString();
          if(isDone(id) || consumed.has(id)) continue;
          picked.push({ taskId:id, text:h.text, minutes:h.minutes, item:{ course:h.course, text:"Daily habit" } });
          consumed.add(id);
          budget.v -= h.minutes;
        }
      }
      // weekly habits take whatever's left; eligible as soon as their course's current
      // period opens, and blocks are visited oldest-first so these naturally land near
      // period start
      for(let hi=0; hi<WEEKLY_HABITS.length; hi++){
        if(budget.v<=0) break;
        const h = WEEKLY_HABITS[hi];
        if(h.minutes>budget.v) continue;
        const periodStart = periodStartFor(block.date, h.weekStart);
        const id = "habit-w-"+hi+"-"+periodStart.toDateString();
        if(isDone(id) || consumed.has(id)) continue;
        picked.push({ taskId:id, text:h.text, minutes:h.minutes, item:{ course:h.course, text:"Weekly habit" } });
        consumed.add(id);
        budget.v -= h.minutes;
      }
    }

    for(const block of blocks){
      const remaining = { v: Math.min(block.capacityMin, SESSION_CAP_MIN) };
      const picked = [];
      fillFrom(byPriority, block, remaining, picked, true);  // only what's actually due-soon-enough to matter here
      const usedByDeadlines = Math.min(block.capacityMin, SESSION_CAP_MIN) - remaining.v;
      const habitBudget = { v: Math.min(block.capacityMin-usedByDeadlines, HABIT_CAP_MIN) };
      fillHabits(block, habitBudget, picked);
      if(picked.length) assignment[block.blockKey] = picked;
    }
    return assignment;
  }
  function toggleTask(item, idx){
    const taskId = item.id+"::t"+idx;
    setDone(taskId, !isDone(taskId));
    const tasks = getTasks(item);
    const allDone = tasks.every((t,i)=> isDone(item.id+"::t"+i));
    setDone(item.id, allDone);
    refreshAll();
    renderBlockModal();
  }

  // ---- done-state store (localStorage) ----
  const DONE_KEY = "semcal-done-v1";
  function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY)||"{}"); }catch(e){ return {}; } }
  let doneState = loadDone();
  function isDone(id){ return !!doneState[id]; }
  function setDone(id,val){
    if(val) doneState[id]=true; else delete doneState[id];
    try{ localStorage.setItem(DONE_KEY, JSON.stringify(doneState)); }catch(e){}
  }
  function toggleDone(id){ setDone(id, !isDone(id)); refreshAll(); }

  // Calendar blocks: past ones are checked by default (the time already happened),
  // but that's just a default — an explicit check or uncheck always wins over it.
  function isBlockDone(blockId, autoByTime){
    if(doneState[blockId]) return true;
    if(doneState[blockId+":off"]) return false;
    return autoByTime;
  }
  function toggleBlockDone(blockId, autoByTime){
    if(isBlockDone(blockId, autoByTime)){
      setDone(blockId, false);
      setDone(blockId+":off", autoByTime);
    } else {
      setDone(blockId, true);
      setDone(blockId+":off", false);
    }
    refreshAll();
  }

  function buildDayBlocks(week, day){
    let blocks = (week.noClasses && day!=="Sat" && day!=="Sun") ? noClassDay.map(b=>b.slice()) : base[day].map(b=>b.slice());

    if(week.satOverride && day==="Sat"){
      const so = week.satOverride;
      const soStart = toMin(so.start), soEnd = toMin(so.end);
      const newBlocks = []; let inserted=false;
      blocks.forEach(b=>{
        const [s,e,l,c] = b;
        const sMin=toMin(s), eMin=toMin(e);
        if(sMin < soEnd && eMin > soStart){
          if(sMin < soStart) newBlocks.push([s, so.start, l, c]);
          if(!inserted){ newBlocks.push([so.start, so.end, so.label, so.cat]); inserted=true; }
          if(eMin > soEnd) newBlocks.push([so.end, e, l, c]);
        } else {
          newBlocks.push(b);
        }
      });
      blocks = newBlocks;
    }

    (week.overrides||[]).forEach(ov=>{
      if(ov.day!==day) return;
      blocks.forEach(b=>{
        if(b[2].indexOf(ov.match)!==-1){
          if(ov.exam){ b[2]=ov.newLabel; b[3]="exam"; }
          if(ov.append) b[2]=b[2]+ov.append;
          if(ov.flag) b[4]="flag";
        }
      });
    });
    return blocks;
  }

    const headTimeCell = document.createElement("div");

    DAYS.forEach((day,i)=>{

      head.innerHTML = `<div class="dayname">${DAYFULL[i]}</div><div class="daydate mono">${dateLabel}</div>
        <div class="duewrap">${dueList.map((entry,idx)=>{
          const did = "due-"+week.id+"-"+day+"-"+idx;

          return `<label class="duetag${done?" done":""}"><input type="checkbox" data-id="${did}" ${done?"checked":""}><span>${entry.text}</span></label>`;
        }).join("")}</div>`;
      headrow.appendChild(head);
      head.querySelectorAll(".duetag input[type=checkbox]").forEach(cb=>{
        cb.addEventListener("change", ()=> toggleDone(cb.dataset.id));

      const col = document.createElement("div");
      col.className = "daycol timeline-bg";
      col.style.height = (TOTAL_MIN*PPM)+"px";

      const now = new Date();
      buildDayBlocks(week, day).forEach(b=>{
        const [start,end,label,cat,flagMark] = b;
        const top = (toMin(start)-START_MIN)*PPM;
        const height = (toMin(end)-toMin(start))*PPM;
        const div = document.createElement("div");
        const blockId = "blk-"+week.id+"-"+day+"-"+start;

        if(week.dates){
          const [eh,em] = end.split(":").map(Number);
          const blockEnd = new Date(week.dates[i]); blockEnd.setHours(eh,em,0,0);
          autoByTime = blockEnd <= now;
        }
        const done = isBlockDone(blockId, autoByTime);
        div.className = "block " + cat + (flagMark ? " flagged" : "") + (done ? " done" : "");
        div.style.top = top+"px";
        div.style.height = Math.max(height,16)+"px";
        div.innerHTML = `<span class="t"><input type="checkbox" class="block-check" ${done?"checked":""} aria-label="Mark done">${fmt(start)}–${fmt(end)}</span><span class="l">${label}</span>`;
        div.querySelector(".block-check").addEventListener("click", e=>{
          e.stopPropagation();
          toggleBlockDone(blockId, autoByTime);
        });
        if(cat==="study"){
          div.style.cursor = "pointer";
          const blockDate = week.dates ? week.dates[i] : null;
          div.addEventListener("click", ()=> openBlockModal(blockDate, start, end, label));

        col.appendChild(div);
      });

      bodyrow.appendChild(col);
    });

    calwrap.style.flexDirection = "column";
    calwrap.appendChild(headrow);
    calwrap.appendChild(bodyrow);
  }

  // ---- to-do tab ----
  // Priority = how much of the course grade an item is worth, scaled up the
  // closer its due date gets. Overdue undone items always sort to the very top.
  function priorityScore(item){
    const date = resolveDeadlineDate(item);
    if(!date) return -1; // TBA (e.g. an unpublished final) sorts below everything dated
    const today = new Date(); today.setHours(0,0,0,0);
    const daysUntil = Math.round((date-today)/86400000);
    if(daysUntil < 0) return 10000 + item.weight;
    return item.weight / (daysUntil + 1);
  }

  function todoRowHtml(item, small){
    const date = resolveDeadlineDate(item);
    const done = isDone(item.id);
    const today = new Date(); today.setHours(0,0,0,0);
    const overdue = date && date < today && !done;
    const dateStr = date ? date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : "TBA";
    const color = "var(--"+(COURSE_COLOR[item.course]||"class")+")";
    const weightStr = item.weight ? (Math.round(item.weight*10)/10)+"%" : "";
    return `<label class="todo-row${small?" small":""}${done?" done":""}${overdue?" overdue":""}">
      <input type="checkbox" data-id="${item.id}" ${done?"checked":""} style="accent-color:${color}">
      ${small?"":`<span class="todo-course" style="color:${color}">${COURSE_NAMES[item.course]||item.course}</span>`}
      <span class="todo-text">${item.text}</span>
      ${weightStr && !small ? `<span class="todo-weight mono">${weightStr}</span>` : ""}
      <span class="todo-date mono">${dateStr}</span>
    </label>`;
  }

  function renderTodo(){
    const el = document.getElementById("todolist");
    if(!DEADLINES.length){ el.innerHTML = `<div class="todo-empty">Nothing on the list.</div>`; return; }

    const undone = DEADLINES.filter(i=>!isDone(i.id)).sort((a,b)=> priorityScore(b)-priorityScore(a));
    const done = DEADLINES.filter(i=>isDone(i.id)).sort((a,b)=>{
      const da = resolveDeadlineDate(a), db = resolveDeadlineDate(b);
      return (da?da.getTime():Infinity) - (db?db.getTime():Infinity);
    });

    let html = undone.map(i=> todoRowHtml(i,false)).join("");
    if(done.length){
      html += `<div class="todo-divider">Done</div>` + done.map(i=> todoRowHtml(i,false)).join("");
    }
    el.innerHTML = html;
    el.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=> toggleDone(cb.dataset.id));
    });
  }

  // ---- progress tab ----
  function renderProgress(){
    const el = document.getElementById("proglist");
    const courses = Object.keys(COURSE_NAMES);
    el.innerHTML = courses.map(c=>{
      const items = DEADLINES.filter(i=>i.course===c).sort((a,b)=>{
        const da = resolveDeadlineDate(a), db = resolveDeadlineDate(b);
        return (da?da.getTime():Infinity) - (db?db.getTime():Infinity);
      });
      const doneCount = items.filter(i=>isDone(i.id)).length;
      const pct = items.length ? Math.round(doneCount/items.length*100) : 0;
      const color = "var(--"+COURSE_COLOR[c]+")";
      return `<div class="course-card">
        <div class="course-head">
          <span class="course-name" style="color:${color}">${COURSE_NAMES[c]}</span>
          <span class="course-count mono">${doneCount}/${items.length} done</span>
        </div>
        <div class="course-bar-track"><div class="course-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="course-items">${items.map(i=>todoRowHtml(i,true)).join("")}</div>
      </div>`;
    }).join("");
    el.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=> toggleDone(cb.dataset.id));
    });
  }

  // ---- now strip ----
  function resolveWeekForDate(date){
    for(const w of weeks){
      if(!w.dates) continue;
      const start = new Date(w.dates[0]); start.setHours(0,0,0,0);
      const end = new Date(w.dates[6]); end.setHours(23,59,59,999);
      if(date>=start && date<=end) return w;
    }
    return null;
  }

  function renderNowStrip(){
    const el = document.getElementById("nowstrip");
    const now = new Date();
    const week = resolveWeekForDate(now);
    let html = "";

    if(week && !week.noClasses){
      const dayIdx = (now.getDay()+6)%7;
      const dayName = DAYS[dayIdx];
      const nowMin = now.getHours()*60 + now.getMinutes();
      const blocks = buildDayBlocks(week, dayName);
      let current=null, next=null;
      for(const b of blocks){
        const s=toMin(b[0]), e=toMin(b[1]);
        if(nowMin>=s && nowMin<e) current=b;
        if(nowMin<s && !next) next=b;
      }
      if(!next && dayIdx<6){
        const tBlocks = buildDayBlocks(week, DAYS[dayIdx+1]);
        if(tBlocks.length) next = tBlocks[0];
      }
      if(current){
        html += `<div class="now-pill current"><span class="now-label">Now</span> ${current[2]}<span class="mono">until ${fmt(current[1])}</span></div>`;
      }
      if(next){
        html += `<div class="now-pill next"><span class="now-label">Next</span> ${next[2]}<span class="mono">${fmt(next[0])}</span></div>`;
      }
      if(!current && !next){
        html += `<div class="now-pill">Day's done — rest up.</div>`;
      }
    } else {
      html += `<div class="now-pill">No fixed schedule today${week ? " ("+week.label+")" : ""}.</div>`;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = DEADLINES
      .map(item=>({ item, date: resolveDeadlineDate(item) }))
      .filter(x=> x.date && x.date>=today && !isDone(x.item.id))
      .sort((a,b)=> a.date-b.date);
    if(upcoming.length){
      const {item,date} = upcoming[0];
      const days = Math.round((date-today)/86400000);
      const when = days===0 ? "today" : days===1 ? "tomorrow" : `in ${days}d`;
      const courseName = COURSE_NAMES[item.course]||"";
      const label = item.text.indexOf(courseName)===0 ? item.text : (courseName+" "+item.text).trim();
      html += `<div class="now-pill deadline"><span class="now-label">Next due</span> ${label}<span class="mono">${when}</span></div>`;
    }

    el.innerHTML = html;
  }

    document.getElementById("modalTitle").textContent = label;
    document.getElementById("modalSub").textContent =
      (date ? date.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})+" · " : "") + fmt(start)+"–"+fmt(end);

    const body = document.getElementById("modalBody");
    if(!date){
      body.innerHTML = `<div class="modal-empty">This is the standard-week template, not a specific date — pick a real week above to see what's planned for this block.</div>`;
      return;
    }
    const blockKey = date.toDateString()+"|"+start;
    const tasks = scheduleTasks()[blockKey];
    if(!tasks || !tasks.length){
      body.innerHTML = `<div class="modal-empty">Nothing due soon enough to need this block yet — it's flexible time (or, if this is in the past, it's already gone by). Check back closer to your next deadline.</div>`;
      return;
    }
    const today = new Date(); today.setHours(0,0,0,0);
    body.innerHTML = tasks.map(t=>{
      const itemDate = resolveDeadlineDate(t.item);
      const daysUntil = itemDate ? Math.round((itemDate-today)/86400000) : null;
      const urgent = daysUntil!==null && daysUntil<=1;
      const done = isDone(t.taskId);
      const color = "var(--"+(COURSE_COLOR[t.item.course]||"class")+")";
      return `<label class="task-row${done?" done":""}">
        <input type="checkbox" data-taskid="${t.taskId}" ${done?"checked":""} style="accent-color:${color}">
        <span class="task-main">
          <span class="task-course" style="color:${color}">${COURSE_NAMES[t.item.course]||t.item.course} · ${t.item.text}${urgent?'<span class="task-urgent">priority</span>':""}</span>
          <span class="task-text">${t.text}</span>
        </span>
      </label>`;
    }).join("");
    const usedMin = tasks.reduce((sum,t)=> sum+t.minutes, 0);
    const blockMin = toMin(end)-toMin(start);
    if(blockMin-usedMin >= 20){
      body.innerHTML += `<div class="modal-empty">That's ~${usedMin} min scheduled — the rest of this block (${blockMin-usedMin} min) is flexible: buffer, review, or anything else not tracked here.</div>`;
    }
    body.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const taskId = cb.dataset.taskid;
        if(taskId.indexOf("habit-")===0){
          setDone(taskId, !isDone(taskId));
          refreshAll();
          renderBlockModal();
          return;
        }
        const [itemId, tIdx] = taskId.split("::t");
        const item = DEADLINES.find(d=>d.id===itemId);
        if(item) toggleTask(item, Number(tIdx));
      });
    });
  }
  document.getElementById("modalClose").addEventListener("click", closeBlockModal);
  document.getElementById("modalBackdrop").addEventListener("click", e=>{
    if(e.target.id==="modalBackdrop") closeBlockModal();
  });

  // ---- tabs ----
  document.getElementById("tabbar").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    [...document.querySelectorAll("#tabbar button")].forEach(b=> b.classList.toggle("active", b===btn));
    const tab = btn.dataset.tab;
    document.getElementById("view-cal").hidden = tab!=="cal";
    document.getElementById("view-todo").hidden = tab!=="todo";
    document.getElementById("view-prog").hidden = tab!=="prog";
    if(tab==="todo") renderTodo();
    if(tab==="prog") renderProgress();
  });

  const initialWeek = resolveWeekForDate(new Date());
  render(initialWeek ? initialWeek.id : "w2");
  renderTodo();
  renderProgress();
  renderNowStrip();
  setInterval(renderNowStrip, 30000);

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
